<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="简答">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon-192.png">
<title>简答练习器</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#1b1f24; --muted:#6b7280; --line:#e5e7eb;
    --brand:#2f6feb; --brand-soft:#eaf1ff;
    --good:#12805c; --good-bg:#e6f6ef;
    --ok:#2f6feb;  --ok-bg:#eaf1ff;
    --warn:#9a6700;--warn-bg:#fff4d6;
    --bad:#b42318; --bad-bg:#fdecea;
    --radius:14px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14161a; --card:#1c1f25; --ink:#e8eaed; --muted:#9aa3ad; --line:#2c3138;
      --brand:#7aa2ff; --brand-soft:#1e2a44;
      --good:#4ade80; --good-bg:#132a20;
      --ok:#7aa2ff;  --ok-bg:#1e2a44;
      --warn:#fbbf24;--warn-bg:#33280f;
      --bad:#f87171; --bad-bg:#3a1715;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:820px;margin:0 auto;padding:18px 16px 64px}

  header.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  header.top h1{font-size:18px;margin:0;letter-spacing:.02em}
  .badge{font-size:12px;color:var(--good);background:var(--good-bg);border-radius:999px;padding:2px 9px}
  .stats{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  select,button{font:inherit}
  select{
    appearance:none;background:var(--card);color:var(--ink);border:1px solid var(--line);
    border-radius:10px;padding:8px 30px 8px 11px;font-size:14px;max-width:100%;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  }

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 20px 6px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:1px 9px}
  .chip.star3{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
  .chip.star2{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
  .chip.real{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 40%,transparent)}
  .chip.mark{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
  .counter{margin-left:auto;font-variant-numeric:tabular-nums}

  .q{font-size:21px;line-height:1.55;font-weight:650;margin:4px 0 14px;word-break:break-word}
  .q .num{color:var(--muted);font-weight:500;margin-right:6px}

  textarea{
    width:100%;min-height:168px;resize:vertical;padding:13px 14px;border-radius:12px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;line-height:1.7;
  }
  textarea:focus{outline:2px solid color-mix(in srgb,var(--brand) 35%,transparent);outline-offset:1px;border-color:var(--brand)}

  .actions{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0 16px}
  button.btn{
    border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:10px 16px;cursor:pointer;font-size:15px;transition:transform .04s ease;
  }
  button.btn:active{transform:translateY(1px)}
  button.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  button.btn.ghost{background:transparent}
  button.btn:disabled{opacity:.45;cursor:not-allowed}
  .kbd{font-size:12px;opacity:.7;margin-left:6px}

  .result{border-top:1px dashed var(--line);padding:16px 0 10px;margin-top:4px}
  .score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .score .num{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .score .num small{font-size:16px;font-weight:600;color:var(--muted)}
  .tag{border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600}
  .tag.good{color:var(--good);background:var(--good-bg)}
  .tag.ok{color:var(--ok);background:var(--ok-bg)}
  .tag.warn{color:var(--warn);background:var(--warn-bg)}
  .tag.bad{color:var(--bad);background:var(--bad-bg)}
  .score .sub{font-size:13px;color:var(--muted);flex:1 1 100%}

  .kps{list-style:none;padding:0;margin:16px 0 4px}
  .kps li{display:flex;gap:9px;padding:10px 0;border-top:1px solid var(--line);font-size:15px;align-items:flex-start}
  .kps li:first-child{border-top:0}
  .kps .ico{flex:0 0 18px;font-size:14px;line-height:1.9}
  .kps .body{flex:1}
  .kps .lab{font-weight:700}
  .kps .pt{font-size:12px;color:var(--muted);margin-left:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .kps .pt b{color:var(--ink);font-weight:600}
  .kps mark{background:transparent;color:var(--bad);font-weight:700;border-bottom:2px solid color-mix(in srgb,var(--bad) 55%,transparent)}

  .answer{margin-top:14px;background:var(--brand-soft);border-radius:12px;padding:13px 15px;font-size:15px}
  .answer h3{margin:0 0 6px;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
  .answer pre{margin:0;white-space:pre-wrap;font:inherit;line-height:1.7}

  .note{font-size:12.5px;color:var(--muted);margin:12px 0 0;line-height:1.6}
  .nav{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
  .nav .spacer{flex:1}
  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);
    background:#111;color:#fff;padding:9px 15px;border-radius:10px;font-size:14px;
    opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90vw
  }
  .toast.show{opacity:.95;transform:translateX(-50%) translateY(0)}
  footer.foot{margin-top:22px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
  footer.foot button{background:none;border:0;color:var(--muted);text-decoration:underline dotted;cursor:pointer;padding:0;font-size:12px}

  /* —— 手机优先 —— */
  @media (max-width:560px){
    .wrap{padding:14px 14px calc(26px + env(safe-area-inset-bottom))}
    header.top{gap:8px;margin-bottom:10px}
    .stats{width:100%;margin-left:0;font-size:12.5px}
    .filters{gap:7px}
    .filters select{flex:1 1 calc(50% - 7px);min-width:0;min-height:46px;font-size:16px}
    .filters select:first-child{flex:1 1 100%}
    .kbd{display:none}
    .card{padding:16px 15px 4px}
    .q{font-size:19px}
    textarea{min-height:170px;font-size:17px;padding:14px}
    button.btn{min-height:48px;font-size:16px;flex:1 1 auto}
    button.btn.primary{flex:1 1 100%}
    .actions{gap:8px;margin:12px 0 14px}
    .score .num{font-size:38px}
    .kps li{font-size:15.5px;padding:11px 0}
    .answer{font-size:15.5px;padding:14px}
    .nav .btn{flex:1 1 46%}
    .nav .spacer{display:none}
    .toast{bottom:calc(18px + env(safe-area-inset-bottom))}
  }
  button,select,textarea,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  button.btn{-webkit-touch-callout:none;user-select:none}
  select,textarea{font-size:16px}
  /* 返回入口页 */
  .back{align-self:center;display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;
    border-radius:11px;border:1px solid var(--line);color:var(--muted);text-decoration:none;
    font-size:19px;line-height:1;flex:0 0 auto;transition:border-color .15s,color .15s}
  .back:hover{border-color:var(--brand);color:var(--brand)}
  .back:active{transform:translateY(1px)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="back" href="../" aria-label="返回入口页" title="返回入口页">←</a>
    <h1 id="title">简答练习器</h1>
    <span class="badge">纯本地 · 按采分点给分</span>
    <span class="stats" id="stats"></span>
  </header>

  <div class="filters">
    <select id="f-chapter" aria-label="章节"></select>
    <select id="f-stars" aria-label="重要程度">
      <option value="all">全部星级</option>
      <option value="3">★★★ 必须完整默写</option>
      <option value="2">★★ 能分点复述</option>
      <option value="1">★ 了解</option>
    </select>
    <select id="f-mode" aria-label="出题顺序">
      <option value="seq">按顺序</option>
      <option value="random">随机</option>
      <option value="new">只刷没做过的</option>
      <option value="wrong">只刷错题</option>
    </select>
  </div>

  <main class="card" id="card">
    <div class="meta">
      <span class="chip" id="c-chapter"></span>
      <span class="chip" id="c-star"></span>
      <span class="chip real" id="c-tag" hidden></span>
      <span class="chip mark" id="c-mark"></span>
      <span class="counter" id="c-counter"></span>
    </div>
    <div class="q" id="q">—</div>

    <textarea id="input" placeholder="按点写，一行一个采分点，不用写完整句子（Ctrl+Enter 提交）" spellcheck="false"></textarea>

    <div class="actions">
      <button class="btn primary" id="btn-submit">提交判分<span class="kbd">Ctrl+↵</span></button>
      <button class="btn" id="btn-reveal">直接看答案</button>
      <button class="btn ghost" id="btn-skip">跳过</button>
    </div>

    <section class="result" id="result" hidden>
      <div class="score">
        <div class="num" id="r-score">0<small> 分</small></div>
        <span class="tag" id="r-tag">—</span>
        <span class="sub" id="r-sub"></span>
      </div>
      <ul class="kps" id="r-kps"></ul>
      <div class="answer">
        <h3>标准答案</h3>
        <pre id="r-answer"></pre>
      </div>
      <p class="note">按<b>采分点</b>给分：每个点只看你有没有写到，顺序和措辞不限；答对意思但换个说法可能被标红，答错的内容它发现不了。分值按要点字数分配，只是本地估分，以标准答案为准。</p>
    </section>

    <div class="nav">
      <button class="btn ghost" id="btn-prev">← 上一题</button>
      <span class="spacer"></span>
      <button class="btn" id="btn-next">下一题 →</button>
    </div>
  </main>

  <footer class="foot">
    <button id="btn-wrongbook">错题本（<span id="wrong-count">0</span>）</button>
    <button id="btn-export">导出进度</button>
    <button id="btn-reset">清空进度</button>
    <span id="foot-meta"></span>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>/*
 * 判分核心（两个练习器共用：名词解释 / 简答）
 * 纯本地：不联网、不调用任何模型、不花 token。
 * 会被内联进各自的 HTML，也供 build.mjs / selftest.mjs 在 node 里 require（通过 globalThis.GradeCore）。
 *
 * 共同思路：
 *   1. 归一化（全半角、大小写、去空白标点）
 *   2. 把标准答案切成「要点」
 *   3. 每个要点的覆盖度 = 它的「二字片段（bigram）」被学习者作答命中的比例
 *   4. 覆盖 70% 即视为该要点拿满分
 *
 * 两个入口：
 *   grade(def, answer)                    名词解释：整条定义切要点，百分制
 *   gradePoints(points, answer, fullMark)  简答：按「采分点」给分，满分 8 分制
 */
(function () {
  'use strict';

  var PUNCT = /[\s\u3000，。；：、！？·—－–\-_/\\|~`!@#$%^&*+=:;,.?'"“”‘’（）()\[\]【】《》<>…]/g;

  function normalize(s) {
    return String(s == null ? '' : s)
      .normalize('NFKC')
      .toLowerCase()
      .replace(PUNCT, '');
  }

  function bigrams(s) {
    var set = new Set();
    if (!s) return set;
    if (s.length === 1) { set.add(s); return set; }
    for (var i = 0; i < s.length - 1; i++) set.add(s.slice(i, i + 2));
    return set;
  }

  // 定义 → 要点列表（保留原文，用于展示）
  // 只在 。；和过长的逗号句处切，等号（本质＝…、公式 N = …）一律原样留着，
  // 否则「本质」这类标签会被切出来当成独立要点，判分时会误报「漏了本质」。
  function splitKeypoints(def) {
    var raw = String(def == null ? '' : def).trim();
    if (!raw) return [];
    var parts = raw.split(/[；;。]/).map(function (s) { return s.trim(); }).filter(Boolean);
    var out = [];
    parts.forEach(function (p) {
      if (normalize(p).length <= 46) {
        out.push(p);
      } else {
        p.split(/[，,]/).map(function (s) { return s.trim(); }).filter(Boolean)
          .forEach(function (x) { out.push(x); });
      }
    });
    // 过短的碎片并回上一条
    var merged = [];
    out.forEach(function (piece) {
      var n = normalize(piece).length;
      if (n === 0) return;
      if (n < 8 && merged.length) {
        merged[merged.length - 1] = merged[merged.length - 1] + '，' + piece;
      } else {
        merged.push(piece);
      }
    });
    return merged;
  }

  // 逐字标记「作答里没有覆盖到的部分」，用于展示差在哪里
  function markMissing(text, ansGrams) {
    var segs = [];
    var i = 0;
    while (i < text.length) {
      var g = text.slice(i, i + 2);
      var miss = i < text.length - 1 ? !ansGrams.has(g) : true;
      if (!segs.length || segs[segs.length - 1].miss !== miss) segs.push({ t: text[i], miss: miss });
      else segs[segs.length - 1].t += text[i];
      i++;
    }
    return segs;
  }

  function levelOf(score) {
    if (score >= 85) return { label: '优秀', tone: 'good', tip: '基本能默写了' };
    if (score >= 70) return { label: '良好', tone: 'ok', tip: '主干对了，补上标红的部分' };
    if (score >= 55) return { label: '及格', tone: 'warn', tip: '要点缺得比较多，建议今天再刷一遍' };
    return { label: '待加强', tone: 'bad', tip: '先把标准答案读两遍，再回头重写' };
  }

  // 一个要点对一份作答的覆盖情况
  function coverageOf(text, ansNorm, ansGrams) {
    var kn = normalize(text);
    var kg = bigrams(kn);
    var hit = 0;
    if (kn.length <= 1) {
      hit = kn && ansNorm.indexOf(kn) >= 0 ? 1 : 0;
      kg = new Set([kn || ' ']);
    } else {
      kg.forEach(function (g) { if (ansGrams.has(g)) hit++; });
    }
    var cov = kg.size ? hit / kg.size : 0;
    return { cov: cov, mark: markMissing(text, ansGrams) };
  }

  // —— 名词解释：整条定义切要点，百分制 ——
  function grade(def, answer) {
    var kps = splitKeypoints(def);
    var ansNorm = normalize(answer);
    var ansGrams = bigrams(ansNorm);
    var totalW = 0, gotW = 0;
    var items = kps.map(function (k) {
      var c = coverageOf(k, ansNorm, ansGrams);
      var w = Math.max(normalize(k).length, 2);
      var credit = Math.min(1, c.cov / 0.7);
      totalW += w;
      gotW += w * credit;
      return {
        text: k,
        coverage: Math.round(c.cov * 100),
        status: c.cov >= 0.6 ? 'hit' : (c.cov >= 0.3 ? 'part' : 'miss'),
        mark: c.mark
      };
    });
    var score = totalW ? Math.round((gotW / totalW) * 100) : 0;
    if (!ansNorm) score = 0;
    return {
      score: score,
      level: levelOf(score),
      items: items,
      hitCount: items.filter(function (i) { return i.status === 'hit'; }).length,
      totalCount: items.length,
      chars: ansNorm.length,
      empty: !ansNorm
    };
  }

  // —— 简答：按采分点给分，满分默认 8 分 ——
  // points: [{ label, body }]，来自题库解析；分值按要点字数分配，最小 0.5
  function allocatePoints(points, fullMark) {
    var weights = points.map(function (p) { return Math.max(normalize(p.label + p.body).length, 2); });
    var total = weights.reduce(function (a, b) { return a + b; }, 0);
    var scores = weights.map(function (w) { return Math.max(0.5, Math.round((w / total) * fullMark * 2) / 2); });
    var sum = scores.reduce(function (a, b) { return a + b; }, 0);
    var diff = Math.round((fullMark - sum) * 2) / 2;
    if (diff !== 0 && scores.length) {
      var maxIdx = scores.indexOf(Math.max.apply(null, scores));
      scores[maxIdx] = Math.max(0.5, scores[maxIdx] + diff);
    }
    return scores;
  }

  function gradePoints(points, answer, fullMark) {
    fullMark = fullMark || 8;
    var ansNorm = normalize(answer);
    var ansGrams = bigrams(ansNorm);
    var alloc = allocatePoints(points, fullMark);
    var got = 0;
    var items = points.map(function (p, i) {
      var text = p.label ? p.label + '：' + p.body : p.body;
      var c = coverageOf(text, ansNorm, ansGrams);
      if (!ansNorm) c.cov = 0;
      var status = c.cov >= 0.6 ? 'hit' : (c.cov >= 0.3 ? 'part' : 'miss');
      // 判成「漏」就一分不给，否则会出现「❌ 0.5/1.5 分」这种自相矛盾的展示
      var credit = status === 'miss' ? 0 : Math.min(1, c.cov / 0.7);
      got += alloc[i] * credit;
      return {
        no: i + 1,
        label: p.label || '',
        body: p.body,
        full: alloc[i],
        got: Math.round(alloc[i] * credit * 2) / 2,
        coverage: Math.round(c.cov * 100),
        status: status,
        // 标红只覆盖正文：标签在界面上单独加粗显示，重复标一次会看起来像复制粘贴
        mark: markMissing(p.body, ansGrams)
      };
    });
    var score = Math.round(Math.min(got, fullMark) * 2) / 2;
    var ratio = fullMark ? score / fullMark : 0;
    var count = function (s) { return items.filter(function (i) { return i.status === s; }).length; };
    return {
      score: score,
      fullMark: fullMark,
      ratio: ratio,
      level: levelOf(ratio * 100),
      items: items,
      hitCount: count('hit'),
      partCount: count('part'),
      missCount: count('miss'),
      totalCount: items.length,
      chars: ansNorm.length,
      empty: !ansNorm
    };
  }

  globalThis.GradeCore = {
    normalize: normalize,
    bigrams: bigrams,
    splitKeypoints: splitKeypoints,
    coverageOf: coverageOf,
    grade: grade,
    gradePoints: gradePoints,
    allocatePoints: allocatePoints,
    levelOf: levelOf
  };
})();
</script>

"}],"answer":"定位周质或胞外分泌表达\n用蛋白酶缺陷菌株；低温培养\n融合蛋白形式表达\n置换多肽链氨基酸消除蛋白酶切点；疏水性修饰","fullMark":8},{"n":18,"ch":"三、基因表达与克隆策略（第一、四章）","stars":3,"tag":"体外翻译）蛋白表达系统（2025","year":2025,"q":"无细胞","points":[{"label":"","body":"体外翻译系统＝模拟细胞质蛋白合成过程的开放表达系统，以 DNA/mRNA 为模板，用细胞抽提物酶系 + 补充底物能量合成蛋白"},{"label":"优点","body":"内源 mRNA 干扰小、可加多模板研究蛋白互作、可特异标记产物"},{"label":"","body":"分真核（兔网织红细胞、麦胚、酵母）与原核（大肠杆菌）系统"}],"answer":"体外翻译系统＝模拟细胞质蛋白合成过程的开放表达系统，以 DNA/mRNA 为模板，用细胞抽提物酶系 + 补充底物能量合成蛋白\n优点：内源 mRNA 干扰小、可加多模板研究蛋白互作、可特异标记产物\n分真核（兔网织红细胞、麦胚、酵母）与原核（大肠杆菌）系统","fullMark":8},{"n":19,"ch":"三、基因表达与克隆策略（第一、四章）","stars":2,"tag":"T7 启动子）（2022、2025 高频","year":2025,"q":"简述 pET 表达系统原理","points":[{"label":"","body":"pET 载体在质粒骨架上加入 T7 启动子及下游酶切位点"},{"label":"","body":"T7 启动子只能被 T7 RNA 聚合酶识别，大肠杆菌 RNA 聚合酶不能作用"},{"label":"","body":"宿主 BL21(DE3) 染色体整合了受 lacUV5 启动子控制的 T7 基因 I"},{"label":"","body":"平时 lacI 阻遏物抑制 T7 聚合酶表达→外源基因不表达"},{"label":"","body":"加 IPTG 解除抑制→产生 T7 RNA 聚合酶→启动 T7 启动子控制的外源基因表达"}],"answer":"pET 载体在质粒骨架上加入 T7 启动子及下游酶切位点\nT7 启动子只能被 T7 RNA 聚合酶识别，大肠杆菌 RNA 聚合酶不能作用\n宿主 BL21(DE3) 染色体整合了受 lacUV5 启动子控制的 T7 基因 I\n平时 lacI 阻遏物抑制 T7 聚合酶表达→外源基因不表达\n加 IPTG 解除抑制→产生 T7 RNA 聚合酶→启动 T7 启动子控制的外源基因表达","fullMark":8},{"n":20,"ch":"三、基因表达与克隆策略（第一、四章）","stars":2,"tag":"","year":null,"q":"GST 融合表达载体原理与使用","points":[{"label":"","body":"目的蛋白与 GST 融合表达"},{"label":"","body":"全细胞提取物过谷胱甘肽-琼脂糖亲和层析柱，融合蛋白被吸附、杂蛋白洗脱，再用游离还原型谷胱甘肽洗脱"},{"label":"","body":"凝血酶切去 GST 得纯化目的蛋白"}],"answer":"目的蛋白与 GST 融合表达\n全细胞提取物过谷胱甘肽-琼脂糖亲和层析柱，融合蛋白被吸附、杂蛋白洗脱，再用游离还原型谷胱甘肽洗脱\n凝血酶切去 GST 得纯化目的蛋白","fullMark":8},{"n":21,"ch":"三、基因表达与克隆策略（第一、四章）","stars":3,"tag":"","year":null,"q":"通过哪些技术获得已知序列的侧翼序列（染色体步查/PCR）","points":[{"label":"","body":"反向 PCR（酶切环化 + 反向引物）"},{"label":"","body":"接头 PCR（加已知接头 + 接头引物）"},{"label":"","body":"TAIL-PCR（嵌套特异引物 + 随机简并引物 + 不对称温度循环）。经典染色体步查＝构建文库用探针鉴定相邻克隆"}],"answer":"反向 PCR（酶切环化 + 反向引物）\n接头 PCR（加已知接头 + 接头引物）\nTAIL-PCR（嵌套特异引物 + 随机简并引物 + 不对称温度循环）。经典染色体步查＝构建文库用探针鉴定相邻克隆","fullMark":8},{"n":22,"ch":"四、核酸分析与 PCR（第五、七章）","stars":3,"tag":"2022","year":2022,"q":"简述 DNase I 足迹实验","points":[{"label":"","body":"检测 DNA 中与蛋白质结合的部位"},{"label":"","body":"用 DNase I 部分消化已单链末端标记的待测 DNA（控制酶量使每条链平均切割一次），在变性 PAGE 上形成相差一个核苷酸的梯度条带"},{"label":"","body":"蛋白结合部位阻碍 DNase I 切割，形成\"足迹\"空白区"},{"label":"","body":"以测序条带为分子量标记可知结合区序列"},{"label":"","body":"与 EMSA 互补：EMSA 测\"是否结合\"，足迹法测\"结合部位\""}],"answer":"检测 DNA 中与蛋白质结合的部位\n用 DNase I 部分消化已单链末端标记的待测 DNA（控制酶量使每条链平均切割一次），在变性 PAGE 上形成相差一个核苷酸的梯度条带\n蛋白结合部位阻碍 DNase I 切割，形成\"足迹\"空白区\n以测序条带为分子量标记可知结合区序列\n与 EMSA 互补：EMSA 测\"是否结合\"，足迹法测\"结合部位\"","fullMark":8},{"n":23,"ch":"四、核酸分析与 PCR（第五、七章）","stars":3,"tag":"","year":null,"q":"检测转录水平/翻译水平差异的技术","points":[{"label":"转录水平","body":"Northern 杂交、RT-PCR、mRNA 差别显示、基因芯片、RNA-Seq"},{"label":"翻译水平","body":"Western 杂交、蛋白质芯片、2DGE"}],"answer":"转录水平：Northern 杂交、RT-PCR、mRNA 差别显示、基因芯片、RNA-Seq\n翻译水平：Western 杂交、蛋白质芯片、2DGE","fullMark":8},{"n":24,"ch":"四、核酸分析与 PCR（第五、七章）","stars":3,"tag":"","year":null,"q":"简述 PCR 在基因操作中的应用","points":[{"label":"","body":"扩增未知/侧翼片段（反向 PCR、接头 PCR、TAIL-PCR）"},{"label":"","body":"RT-PCR 测基因表达"},{"label":"","body":"加端引入酶切位点定向克隆；多重 PCR"},{"label":"","body":"RAPD/AFLP 产生指纹"},{"label":"","body":"实时定量 PCR 定量"},{"label":"","body":"菌落/噬菌斑快速鉴定（直接挑菌落 PCR）"},{"label":"","body":"定点诱变（SOE、大引物）"}],"answer":"扩增未知/侧翼片段（反向 PCR、接头 PCR、TAIL-PCR）\nRT-PCR 测基因表达\n加端引入酶切位点定向克隆；多重 PCR\nRAPD/AFLP 产生指纹\n实时定量 PCR 定量\n菌落/噬菌斑快速鉴定（直接挑菌落 PCR）\n定点诱变（SOE、大引物）","fullMark":8},{"n":25,"ch":"四、核酸分析与 PCR（第五、七章）","stars":3,"tag":"2022、2024 必考","year":2024,"q":"Ct 值含义与相对定量计算","points":[{"label":"","body":"Ct＝荧光强度达阈值时的循环数，反映起始模板量（Ct 越小模板越多）"},{"label":"相对定量","body":"先 ΔCt＝Ct(目的)−Ct(内参)，再 ΔΔCt＝ΔCt(处理)−ΔCt(对照)，表达倍数＝2^(−ΔΔCt)"},{"label":"例","body":"目的基因对照/处理 Ct＝15/12，内参 8/9；ΔCt(对照)＝15−8＝7，ΔCt(处理)＝12−9＝3，ΔΔCt＝3−7＝−4，倍数＝2^4＝16 倍（表达增强）"}],"answer":"Ct＝荧光强度达阈值时的循环数，反映起始模板量（Ct 越小模板越多）\n相对定量：先 ΔCt＝Ct(目的)−Ct(内参)，再 ΔΔCt＝ΔCt(处理)−ΔCt(对照)，表达倍数＝2^(−ΔΔCt)\n例：目的基因对照/处理 Ct＝15/12，内参 8/9；ΔCt(对照)＝15−8＝7，ΔCt(处理)＝12−9＝3，ΔΔCt＝3−7＝−4，倍数＝2^4＝16 倍（表达增强）","fullMark":8},{"n":26,"ch":"四、核酸分析与 PCR（第五、七章）","stars":2,"tag":"","year":null,"q":"简述 RNAi 的作用机制","points":[{"label":"","body":"dsRNA 被 Dicer（具 RNaseⅢ 活性的核酸酶）切割成 21–25 nt 的 siRNA→siRNA 反义链引导形成 RISC（RNA 诱导沉默复合体）→RISC 通过碱基配对识别并靶向切割同源 mRNA（距 siRNA 5′ 端 10 个碱基处切割）→mRNA 降解、基因沉默"},{"label":"","body":"分起始阶段和效应阶段"}],"answer":"dsRNA 被 Dicer（具 RNaseⅢ 活性的核酸酶）切割成 21–25 nt 的 siRNA→siRNA 反义链引导形成 RISC（RNA 诱导沉默复合体）→RISC 通过碱基配对识别并靶向切割同源 mRNA（距 siRNA 5′ 端 10 个碱基处切割）→mRNA 降解、基因沉默\n分起始阶段和效应阶段","fullMark":8},{"n":27,"ch":"四、核酸分析与 PCR（第五、七章）","stars":2,"tag":"","year":null,"q":"引物设计原则","points":[{"label":"","body":"长度 15–30 nt，Tm≈(G+C)×4+(A+T)×2≈72℃"},{"label":"","body":"在保守区设计、具特异性"},{"label":"","body":"碱基随机分布避免二级结构"},{"label":"","body":"GC 含量 40–60%"},{"label":"","body":"3′ 端与模板互补、5′ 端可修饰"},{"label":"","body":"自身/引物间连续互补 <4 bp"},{"label":"","body":"3′ 端避开密码子第 3 位"}],"answer":"长度 15–30 nt，Tm≈(G+C)×4+(A+T)×2≈72℃\n在保守区设计、具特异性\n碱基随机分布避免二级结构\nGC 含量 40–60%\n3′ 端与模板互补、5′ 端可修饰\n自身/引物间连续互补 <4 bp\n3′ 端避开密码子第 3 位","fullMark":8},{"n":28,"ch":"五、测序、诱变与文库（第八、九、十章）","stars":3,"tag":"2024","year":2024,"q":"简述 Sanger 双脱氧终止法原理","points":[{"label":"","body":"以待测 DNA 为模板、寡核苷酸为引物，在 DNA 聚合酶催化下合成新链"},{"label":"","body":"反应体系中加入少量 ddNTP，ddNTP 掺入后因缺 3′-OH 而使链合成终止"},{"label":"","body":"因 ddNTP 掺入随机，得到以各 ddNTP 结尾的不同长度片段群"},{"label":"","body":"高分辨率 PAGE 分离，据片段尾部的双脱氧核苷酸读出碱基顺序"}],"answer":"以待测 DNA 为模板、寡核苷酸为引物，在 DNA 聚合酶催化下合成新链\n反应体系中加入少量 ddNTP，ddNTP 掺入后因缺 3′-OH 而使链合成终止\n因 ddNTP 掺入随机，得到以各 ddNTP 结尾的不同长度片段群\n高分辨率 PAGE 分离，据片段尾部的双脱氧核苷酸读出碱基顺序","fullMark":8},{"n":29,"ch":"五、测序、诱变与文库（第八、九、十章）","stars":2,"tag":"","year":null,"q":"化学降解法（Maxam-Gilbert）原理","points":[{"label":"","body":"将待测 DNA 5′ 端放射性标记，用特定化学试剂对不同碱基特异修饰并在修饰位点打断磷酸二酯键，产生一系列 5′ 端标记、长度不一、以特定碱基结尾的片段，凝胶电泳 + 放射自显影读出序列"}],"answer":"将待测 DNA 5′ 端放射性标记，用特定化学试剂对不同碱基特异修饰并在修饰位点打断磷酸二酯键，产生一系列 5′ 端标记、长度不一、以特定碱基结尾的片段，凝胶电泳 + 放射自显影读出序列","fullMark":8},{"n":30,"ch":"五、测序、诱变与文库（第八、九、十章）","stars":2,"tag":"2022 选择","year":2022,"q":"边合成边测序的二代/三代测序技术","points":[{"label":"边合成边测序","body":"Illumina、离子半导体、454、Heliscope、SMRT（单分子）"},{"label":"非边合成边测序","body":"SOLiD（连接测序/两碱基测序）、纳米孔（电信号识别）"},{"label":"单分子测序","body":"Heliscope、SMRT（PacBio）、纳米孔"}],"answer":"边合成边测序：Illumina、离子半导体、454、Heliscope、SMRT（单分子）\n非边合成边测序：SOLiD（连接测序/两碱基测序）、纳米孔（电信号识别）\n单分子测序：Heliscope、SMRT（PacBio）、纳米孔","fullMark":8},{"n":31,"ch":"五、测序、诱变与文库（第八、九、十章）","stars":2,"tag":"","year":null,"q":"定点诱变方法及原理","points":[{"label":"","body":"寡核苷酸介导定点诱变（含 Kunkel 法、位点选择诱变、转化子诱变）"},{"label":"","body":"盒式诱变（合成含突变片段置换）"},{"label":"","body":"PCR 介导（大引物 PCR、重叠延伸 PCR/SOE、双向 PCR）"},{"label":"Dpn I 定点诱变原理","body":"Dpn I 只切甲基化（Dam 位点）DNA；PCR 产物无甲基化不被切，模板质粒在宿主内被 Dam 甲基化被切掉，只留含突变的新链"}],"answer":"寡核苷酸介导定点诱变（含 Kunkel 法、位点选择诱变、转化子诱变）\n盒式诱变（合成含突变片段置换）\nPCR 介导（大引物 PCR、重叠延伸 PCR/SOE、双向 PCR）\nDpn I 定点诱变原理：Dpn I 只切甲基化（Dam 位点）DNA；PCR 产物无甲基化不被切，模板质粒在宿主内被 Dam 甲基化被切掉，只留含突变的新链","fullMark":8},{"n":32,"ch":"五、测序、诱变与文库（第八、九、十章）","stars":2,"tag":"","year":null,"q":"基因组文库构建程序与质量检测","points":[{"label":"","body":"载体制备（纯度高、去磷酸化）"},{"label":"","body":"大分子量基因组 DNA 提取与部分酶切（分子量≥插入片段 3–5 倍）+ PFGE 分级分离"},{"label":"","body":"连接与转化/包装侵染（小体系寻最适比例、脱盐提效）"},{"label":"","body":"质量检测（覆盖倍数＝平均插入长度×克隆数/基因组长度；用已知单拷贝基因探针筛库估覆盖度）"},{"label":"","body":"扩增、分装、保存"}],"answer":"载体制备（纯度高、去磷酸化）\n大分子量基因组 DNA 提取与部分酶切（分子量≥插入片段 3–5 倍）+ PFGE 分级分离\n连接与转化/包装侵染（小体系寻最适比例、脱盐提效）\n质量检测（覆盖倍数＝平均插入长度×克隆数/基因组长度；用已知单拷贝基因探针筛库估覆盖度）\n扩增、分装、保存","fullMark":8},{"n":33,"ch":"五、测序、诱变与文库（第八、九、十章）","stars":2,"tag":"","year":null,"q":"cDNA 文库构建步骤","points":[{"label":"","body":"总 RNA 提取 + mRNA 分离（oligo(dT) 亲和层析）"},{"label":"","body":"第一链合成（反转录酶 + oligo(dT) 或随机引物）"},{"label":"","body":"第二链合成（置换合成法/自身引导法）"},{"label":"","body":"双链 cDNA 加接头克隆进载体导入宿主"}],"answer":"总 RNA 提取 + mRNA 分离（oligo(dT) 亲和层析）\n第一链合成（反转录酶 + oligo(dT) 或随机引物）\n第二链合成（置换合成法/自身引导法）\n双链 cDNA 加接头克隆进载体导入宿主","fullMark":8},{"n":34,"ch":"六、基因编辑与基因组（第九章）","stars":3,"tag":"2022、2025 高频","year":2025,"q":"CRISPR/Cas9 关键元件、原理、脱靶及减少办法","points":[{"label":"关键元件","body":"①CRISPR 序列（成簇规律间隔短回文重复）②Cas9 内切酶（向导 RNA 引导下定向切割）③PAM 位点（3–6 bp 被 Cas9 识别的位点，决定切割位置）④sgRNA（20 nt 靶向配对区 + 42 nt 发夹（结合 Cas9）+ 40 nt 终止子）"},{"label":"原理","body":"sgRNA 与靶 DNA 非模板链互补配对，Cas9 识别 PAM 并形成切割复合体→切割靶序列双链→细胞经 NHEJ（引入缺失/插入突变）或 HDR（提供模板实现定向编辑）修复"},{"label":"脱靶效应减少办法","body":"①优化 sgRNA 设计（选择特异性高的 20 nt 序列、避免同源序列）②用高保真 Cas9 变体（SpCas9-HF1、eSpCas9）③双切口酶（nickase）成对 sgRNA ④缩短 sgRNA 或截短 gRNA ⑤控制 Cas9/sgRNA 剂量与递送方式⑥用 dCas9 融合进行基因沉默/激活而非切割"},{"label":"应用","body":"基因敲除、定点敲入、基因沉默（dCas9）、基因激活（dCas9-VP64）、碱基编辑、文库筛选"}],"answer":"关键元件：①CRISPR 序列（成簇规律间隔短回文重复）②Cas9 内切酶（向导 RNA 引导下定向切割）③PAM 位点（3–6 bp 被 Cas9 识别的位点，决定切割位置）④sgRNA（20 nt 靶向配对区 + 42 nt 发夹（结合 Cas9）+ 40 nt 终止子）\n原理：sgRNA 与靶 DNA 非模板链互补配对，Cas9 识别 PAM 并形成切割复合体→切割靶序列双链→细胞经 NHEJ（引入缺失/插入突变）或 HDR（提供模板实现定向编辑）修复\n脱靶效应减少办法：①优化 sgRNA 设计（选择特异性高的 20 nt 序列、避免同源序列）②用高保真 Cas9 变体（SpCas9-HF1、eSpCas9）③双切口酶（nickase）成对 sgRNA ④缩短 sgRNA 或截短 gRNA ⑤控制 Cas9/sgRNA 剂量与递送方式⑥用 dCas9 融合进行基因沉默/激活而非切割\n应用：基因敲除、定点敲入、基因沉默（dCas9）、基因激活（dCas9-VP64）、碱基编辑、文库筛选","fullMark":8},{"n":35,"ch":"六、基因编辑与基因组（第九章）","stars":2,"tag":"2022、2024","year":2024,"q":"酵母双杂交 / 单杂交原理","points":[{"label":"双杂交","body":"转录激活因子含可分离的 DNA 结合域（BD）与转录激活域（AD）；将 BD 与已知蛋白 X 融合、AD 与目的蛋白 Y 融合共转化酵母，若 X-Y 相互作用则重建有功能转录因子，激活报告基因表达→筛选阳性。用于研究蛋白-蛋白相互作用"},{"label":"单杂交","body":"基于转录因子与 DNA 顺式元件结合调控报告基因的原理，克隆编码目的转录因子基因；将文库蛋白与 GAL4 AD 融合，与含目的 DNA 元件的报告质粒在酵母中作用，据报告基因筛选。用于克隆转录因子/鉴定其靶序列"}],"answer":"双杂交：转录激活因子含可分离的 DNA 结合域（BD）与转录激活域（AD）；将 BD 与已知蛋白 X 融合、AD 与目的蛋白 Y 融合共转化酵母，若 X-Y 相互作用则重建有功能转录因子，激活报告基因表达→筛选阳性。用于研究蛋白-蛋白相互作用\n单杂交：基于转录因子与 DNA 顺式元件结合调控报告基因的原理，克隆编码目的转录因子基因；将文库蛋白与 GAL4 AD 融合，与含目的 DNA 元件的报告质粒在酵母中作用，据报告基因筛选。用于克隆转录因子/鉴定其靶序列","fullMark":8},{"n":36,"ch":"七、植物/动物基因工程（第十一、十二章）","stars":3,"tag":"2022、2024 必考","year":2024,"q":"列举 5 种外源 DNA 导入细胞的方法及原理","points":[{"label":"显微注射","body":"显微注射仪将外源 DNA 直接注入细胞质/核"},{"label":"电激（电穿孔）","body":"高压电脉冲在膜上形成可逆瞬间通道"},{"label":"基因枪","body":"DNA 包被金/钨粒高压射入细胞"},{"label":"脂质体","body":"脂类包裹 DNA 经吞噬/融合进入"},{"label":"磷酸钙共沉淀（PEG/多聚物）","body":"磷酸钙-DNA 共沉淀黏附细胞被摄取"},{"label":"农杆菌介导（植物）","body":"T-DNA 转移"},{"label":"病毒载体","body":"病毒侵染导入"}],"answer":"显微注射：显微注射仪将外源 DNA 直接注入细胞质/核\n电激（电穿孔）：高压电脉冲在膜上形成可逆瞬间通道\n基因枪：DNA 包被金/钨粒高压射入细胞\n脂质体：脂类包裹 DNA 经吞噬/融合进入\n磷酸钙共沉淀（PEG/多聚物）：磷酸钙-DNA 共沉淀黏附细胞被摄取\n农杆菌介导（植物）：T-DNA 转移\n病毒载体：病毒侵染导入","fullMark":8},{"n":37,"ch":"七、植物/动物基因工程（第十一、十二章）","stars":3,"tag":"2022","year":2022,"q":"转基因与传统杂交的异同","points":[{"label":"相同","body":"本质都是通过获得优良基因进行遗传改良，都涉及基因重组与利用"},{"label":"不同","body":"①范围：传统限于种内个体，转基因打破物种间生殖隔离、扩大基因来源②水平：传统在个体/全基因组水平操作、后代表现预见性差，转基因操作明确定义的基因、功能清楚、后代表现可准确预期"}],"answer":"相同：本质都是通过获得优良基因进行遗传改良，都涉及基因重组与利用\n不同：①范围：传统限于种内个体，转基因打破物种间生殖隔离、扩大基因来源②水平：传统在个体/全基因组水平操作、后代表现预见性差，转基因操作明确定义的基因、功能清楚、后代表现可准确预期","fullMark":8},{"n":38,"ch":"七、植物/动物基因工程（第十一、十二章）","stars":3,"tag":"2010","year":2010,"q":"简述农杆菌 Ti 质粒 T-DNA 导入植物基因组的过程","points":[{"label":"","body":"受伤组织释放酚类物质趋化并激活 Vir 基因"},{"label":"","body":"农杆菌附着植物细胞（附着位点有限，需约 16 h 细胞调节期）"},{"label":"","body":"Vir 蛋白加工 T-DNA 形成 T-链（T-DNA 复合物）"},{"label":"","body":"经 IV 型分泌系统转移入植物细胞"},{"label":"","body":"T-DNA 整合到植物基因组"}],"answer":"受伤组织释放酚类物质趋化并激活 Vir 基因\n农杆菌附着植物细胞（附着位点有限，需约 16 h 细胞调节期）\nVir 蛋白加工 T-DNA 形成 T-链（T-DNA 复合物）\n经 IV 型分泌系统转移入植物细胞\nT-DNA 整合到植物基因组","fullMark":8},{"n":39,"ch":"七、植物/动物基因工程（第十一、十二章）","stars":2,"tag":"2010","year":2010,"q":"转基因沉默的原因","points":[{"label":"","body":"多拷贝整合、DNA 甲基化、顺式失活（多拷贝串联甲基化）、反式失活、共抑制（转基因与内源同源基因相互作用）、染色体结构重排、转录后衰退调控"}],"answer":"多拷贝整合、DNA 甲基化、顺式失活（多拷贝串联甲基化）、反式失活、共抑制（转基因与内源同源基因相互作用）、染色体结构重排、转录后衰退调控","fullMark":8},{"n":40,"ch":"七、植物/动物基因工程（第十一、十二章）","stars":2,"tag":"","year":null,"q":"简述 Bt 毒蛋白作用过程","points":[{"label":"","body":"原毒素溶解"},{"label":"","body":"原毒素蛋白酶水解成活性毒素"},{"label":"","body":"毒素穿过围食膜"},{"label":"","body":"毒素与受体结合"},{"label":"","body":"毒素插入膜中；小孔形成"},{"label":"","body":"中肠细胞离子平衡破坏、裂解"}],"answer":"原毒素溶解\n原毒素蛋白酶水解成活性毒素\n毒素穿过围食膜\n毒素与受体结合\n毒素插入膜中；小孔形成\n中肠细胞离子平衡破坏、裂解","fullMark":8},{"n":41,"ch":"七、植物/动物基因工程（第十一、十二章）","stars":2,"tag":"5 种以上，2010","year":2010,"q":"动物细胞转化方法","points":[{"label":"","body":"磷酸钙转染、DEAE-葡聚糖转染、聚阳离子-DMSO、脂质体载体法、电激法、显微注射、基因枪、病毒载体（反转录病毒/腺病毒）、ES 细胞"}],"answer":"磷酸钙转染、DEAE-葡聚糖转染、聚阳离子-DMSO、脂质体载体法、电激法、显微注射、基因枪、病毒载体（反转录病毒/腺病毒）、ES 细胞","fullMark":8},{"n":42,"ch":"七、植物/动物基因工程（第十一、十二章）","stars":2,"tag":"2015","year":2015,"q":"转基因动物主要获得途径","points":[{"label":"","body":"显微注射法（原核期注射）、反转录病毒载体法、胚胎干细胞（ES 细胞）基因打靶 + 囊胚注射、体细胞核移植（克隆）"}],"answer":"显微注射法（原核期注射）、反转录病毒载体法、胚胎干细胞（ES 细胞）基因打靶 + 囊胚注射、体细胞核移植（克隆）","fullMark":8},{"n":43,"ch":"八、制药、疫苗与应用（第十六章）","stars":3,"tag":"2022、2024","year":2024,"q":"基因工程制药基本流程 / 重组疫苗技术路线","points":[{"label":"基本流程","body":"载体构建→工程菌/细胞培养→目的产物分离纯化→鉴定与质控"},{"label":"重组蛋白疫苗（哺乳动物细胞）路线","body":"选定抗原基因片段→插入表达载体→导入 CHO 细胞→表达、加工、生产抗原→分离纯化→验证→疫苗"}],"answer":"基本流程：载体构建→工程菌/细胞培养→目的产物分离纯化→鉴定与质控\n重组蛋白疫苗（哺乳动物细胞）路线：选定抗原基因片段→插入表达载体→导入 CHO 细胞→表达、加工、生产抗原→分离纯化→验证→疫苗","fullMark":8},{"n":44,"ch":"八、制药、疫苗与应用（第十六章）","stars":2,"tag":"2022：大豆耐盐基因","year":2022,"q":"如何克隆某一已知序列基因并用于品种改良","points":[{"label":"","body":"据已知序列设计引物 PCR 扩增获得基因"},{"label":"","body":"与带抗生素标记的载体连接"},{"label":"","body":"用基因枪/农杆菌法转入受体细胞"},{"label":"","body":"抗生素筛选转化细胞"},{"label":"","body":"组织培养成植株"},{"label":"","body":"移栽验证性状（如高盐地筛选耐盐植株）"}],"answer":"据已知序列设计引物 PCR 扩增获得基因\n与带抗生素标记的载体连接\n用基因枪/农杆菌法转入受体细胞\n抗生素筛选转化细胞\n组织培养成植株\n移栽验证性状（如高盐地筛选耐盐植株）","fullMark":8},{"n":45,"ch":"八、制药、疫苗与应用（第十六章）","stars":2,"tag":"2022、2025","year":2025,"q":"如何获得某启动子序列 / 从生物克隆启动子","points":[{"label":"","body":"鸟枪法克隆（随机片段连入无启动子的启动子探针质粒，报告基因激活者含启动子）"},{"label":"","body":"酶保护法（RNA 聚合酶结合区保护酶切位点）"},{"label":"","body":"滤膜结合法（DNA-蛋白复合物结合硝酸纤维素膜）。若已知序列：据侧翼序列 PCR/染色体步查获取"}],"answer":"鸟枪法克隆（随机片段连入无启动子的启动子探针质粒，报告基因激活者含启动子）\n酶保护法（RNA 聚合酶结合区保护酶切位点）\n滤膜结合法（DNA-蛋白复合物结合硝酸纤维素膜）。若已知序列：据侧翼序列 PCR/染色体步查获取","fullMark":8},{"n":46,"ch":"八、制药、疫苗与应用（第十六章）","stars":2,"tag":"","year":null,"q":"基因工程药物/疫苗种类与例子","points":[{"label":"","body":"重组蛋白（胰岛素、生长激素、干扰素、EPO）、疫苗（重组乙肝疫苗、mRNA 疫苗）、抗体药物、核酸药物、基因治疗药物"}],"answer":"重组蛋白（胰岛素、生长激素、干扰素、EPO）、疫苗（重组乙肝疫苗、mRNA 疫苗）、抗体药物、核酸药物、基因治疗药物","fullMark":8},{"n":47,"ch":"九、安全性（第十七章）","stars":2,"tag":"2010","year":2010,"q":"转基因作物潜在环境风险","points":[{"label":"","body":"基因漂移/超级杂草（花粉漂移、种子扩散使转基因进入同种/近缘种，提高杂草性、入侵性）"},{"label":"","body":"对靶生物/非靶生物及生物多样性的影响"},{"label":"","body":"对农业生态与自然生态系统的直接/间接影响"}],"answer":"   function circled(n) { return n <= 20 ? String.fromCharCode(0x2460 + n - 1) : '(' + n + ')'; }
  var STAR = { 3: '★★★ 必须完整默写', 2: '★★ 能分点复述', 1: '★ 了解' };

  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  function buildQueue() {
    var list = DATA.items.filter(function (it) {
      if (S.settings.chapter !== 'all' && it.ch !== S.settings.chapter) return false;
      if (S.settings.stars !== 'all' && String(it.stars) !== S.settings.stars) return false;
      return true;
    });
    if (S.settings.mode === 'wrong') list = list.filter(function (it) { var p = S.progress[it.n]; return p && p.tries > 0 && p.ratio < PASS_RATIO; });
    else if (S.settings.mode === 'new') list = list.filter(function (it) { var p = S.progress[it.n]; return !p || !p.tries; });
    else if (S.settings.mode === 'random') list = shuffle(list);
    S.queue = list; S.pos = 0;
  }
  function current() { return S.queue[S.pos] || null; }

  function stats() {
    var done = 0, sum = 0, wrong = 0;
    Object.keys(S.progress).forEach(function (k) {
      var p = S.progress[k];
      if (p && p.tries > 0) { done++; sum += p.best; if (p.ratio < PASS_RATIO) wrong++; }
    });
    return { done: done, avg: done ? sum / done : 0, wrong: wrong, total: DATA.items.length };
  }

  function refreshChrome() {
    var st = stats();
    $('stats').textContent = '已练 ' + st.done + '/' + st.total + ' · 平均 ' + st.avg.toFixed(1) + '/' + FULL + ' 分';
    $('wrong-count').textContent = st.wrong;
    $('c-counter').textContent = S.queue.length ? (S.pos + 1) + ' / ' + S.queue.length : '0 / 0';
  }

  function resetResult() {
    $('result').hidden = true;
    $('r-kps').innerHTML = '';
    $('r-answer').textContent = '';
    $('r-score').innerHTML = '0<small> 分</small>';
    $('r-tag').className = 'tag';
    $('r-tag').textContent = '—';
    $('r-sub').textContent = '';
    $('btn-reveal').disabled = false;
    $('btn-submit').disabled = false;
  }

  function render() {
    var it = current();
    resetResult();
    refreshChrome();
    if (!it) {
      $('c-chapter').textContent = '没有题目';
      $('c-star').textContent = '';
      $('c-mark').textContent = '';
      $('c-tag').hidden = true;
      $('q').textContent = '这个筛选下没有题了';
      $('input').value = '';
      $('input').disabled = true;
      $('btn-submit').disabled = true;
      $('btn-reveal').disabled = true;
      return;
    }
    $('input').disabled = false;
    $('c-chapter').textContent = it.ch || '未分章';
    $('c-star').textContent = STAR[it.stars] || '';
    $('c-star').className = 'chip star' + it.stars;
    if (it.tag) { $('c-tag').hidden = false; $('c-tag').textContent = it.tag + ' 真题'; } else { $('c-tag').hidden = true; }
    $('c-mark').textContent = FULL + ' 分 · ' + it.points.length + ' 个采分点';
    $('q').innerHTML = '<span class="num">' + it.n + '.</span>' + esc(it.q);
    $('input').value = S.drafts.get(it.n) || '';
    $('input').focus();
  }

  function renderResult(res, it) {
    $('r-score').innerHTML = res.score + '<small> / ' + res.fullMark + ' 分</small>';
    var tag = $('r-tag');
    tag.className = 'tag ' + res.level.tone;
    tag.textContent = res.level.label;
    $('r-sub').textContent = res.level.tip + ' · 采分点 命中 ' + res.hitCount + ' · 部分 ' + res.partCount +
      ' · 漏 ' + res.missCount + ' · 作答 ' + res.chars + ' 字';

    var icon = { hit: '✅', part: '⚠️', miss: '❌' };
    $('r-kps').innerHTML = res.items.map(function (p) {
      // 拿满分的点就不标红了，否则会出现「✅ 全对」旁边一片红自相矛盾
      var body = p.status === 'hit'
        ? esc(p.body)
        : p.mark.map(function (s) { return s.miss ? '<mark>' + esc(s.t) + '</mark>' : esc(s.t); }).join('');
      var lab = p.label ? '<span class="lab">' + esc(p.label) + '：</span>' : '';
      return '<li><span class="ico">' + icon[p.status] + '</span><span class="body">' +
        '<span class="pt">' + circled(p.no) + ' <b>' + p.got + '</b>/' + p.full + ' 分</span><br>' +
        lab + body + '</span></li>';
    }).join('');

    $('r-answer').textContent = it.answer;
    $('result').hidden = false;
  }

  function submit() {
    var it = current();
    if (!it) return;
    var res = G.gradePoints(it.points, $('input').value, it.fullMark);
    renderResult(res, it);

    var p = S.progress[it.n] || { best: 0, ratio: 0, tries: 0, last: '' };
    p.tries += 1;
    if (res.score >= p.best) { p.best = res.score; p.ratio = res.ratio; }
    p.last = new Date().toISOString().slice(0, 10);
    S.progress[it.n] = p;
    store(K_PROGRESS, S.progress);
    refreshChrome();
    $('result').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function reveal() {
    var it = current();
    if (!it) return;
    $('result').hidden = false;
    $('r-kps').innerHTML = '';
    $('r-score').innerHTML = '—';
    $('r-tag').className = 'tag warn';
    $('r-tag').textContent = '已看答案';
    $('r-sub').textContent = '这一次不计分，合上答案再默写一遍才有效';
    $('r-answer').textContent = it.answer;
    $('btn-reveal').disabled = true;
  }

  function go(delta) {
    var it = current();
    if (it) S.drafts.set(it.n, $('input').value);
    if (!S.queue.length) return;
    S.pos = (S.pos + delta + S.queue.length) % S.queue.length;
    render();
  }

  function rebuildAndRender(notice) {
    buildQueue(); render();
    if (notice) toast(notice);
    if (!S.queue.length && S.settings.mode === 'wrong') toast('错题本是空的，先去练几道');
  }

  function bind() {
    $('btn-submit').addEventListener('click', submit);
    $('btn-reveal').addEventListener('click', reveal);
    $('btn-skip').addEventListener('click', function () { go(1); });
    $('btn-prev').addEventListener('click', function () { go(-1); });
    $('btn-next').addEventListener('click', function () { go(1); });
    $('input').addEventListener('input', function () { var it = current(); if (it) S.drafts.set(it.n, $('input').value); });
    $('input').addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); submit(); }
    });
    $('input').addEventListener('focus', function () {
      if (window.matchMedia('(max-width: 560px)').matches) {
        setTimeout(function () { var bar = document.querySelector('.actions'); if (bar) bar.scrollIntoView({ block: 'end', behavior: 'smooth' }); }, 320);
      }
    });
    $('f-chapter').addEventListener('change', function (e) { S.settings.chapter = e.target.value; store(K_SETTINGS, S.settings); rebuildAndRender(); });
    $('f-stars').addEventListener('change', function (e) { S.settings.stars = e.target.value; store(K_SETTINGS, S.settings); rebuildAndRender(); });
    $('f-mode').addEventListener('change', function (e) { S.settings.mode = e.target.value; store(K_SETTINGS, S.settings); rebuildAndRender(); });
    $('btn-wrongbook').addEventListener('click', function () {
      $('f-mode').value = 'wrong'; S.settings.mode = 'wrong'; store(K_SETTINGS, S.settings); rebuildAndRender();
    });
    $('btn-export').addEventListener('click', function () {
      var wrongItems = DATA.items.filter(function (it) { var p = S.progress[it.n]; return p && p.tries > 0 && p.ratio < PASS_RATIO; })
        .map(function (it) { return { n: it.n, q: it.q, ch: it.ch, stars: it.stars, best: S.progress[it.n].best }; });
      var payload = { exportedAt: new Date().toISOString(), stats: stats(), progress: S.progress, wrong: wrongItems };
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '简答进度-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      toast('已导出');
    });
    $('btn-reset').addEventListener('click', function () {
      if (!confirm('清空本机所有练习进度（得分和错题本）？题目本身不受影响。')) return;
      S.progress = {}; store(K_PROGRESS, S.progress); rebuildAndRender('进度已清空');
    });
    document.addEventListener('keydown', function (e) {
      if (e.target && e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowRight') go(1);
      if (e.key === 'ArrowLeft') go(-1);
    });
  }

  function init() {
    document.title = DATA.meta.title + '练习器';
    $('title').textContent = DATA.meta.title + '练习器';
    $('foot-meta').textContent = DATA.meta.total + ' 道 · 来源 ' + DATA.meta.source;

    S.progress = restore(K_PROGRESS, {});
    S.settings = Object.assign(S.settings, restore(K_SETTINGS, {}));

    var isTouch = window.matchMedia('(pointer: coarse)').matches || window.matchMedia('(hover: none)').matches;
    if (isTouch) $('input').placeholder = '按点写，一行一个采分点，不用写完整句子';

    var sel = $('f-chapter');
    sel.innerHTML = '<option value="all">全部章节</option>' + DATA.meta.chapters.map(function (ch) {
      return '<option value="' + esc(ch) + '">' + esc(ch) + '</option>';
    }).join('');
    sel.value = S.settings.chapter;
    $('f-stars').value = S.settings.stars;
    $('f-mode').value = S.settings.mode;

    bind(); buildQueue(); render();

    // 部署到 https 站点后才有离线缓存；双击本地文件时自动跳过
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('../sw.js').catch(function () {});
      });
    }
  }

  init();
})();
</script>
</body>
</html>
