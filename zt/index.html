<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="真题">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon-192.png">
<title>真题速刷</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#1b1f24; --muted:#6b7280; --line:#e5e7eb;
    --brand:#2f6feb; --brand-soft:#eaf1ff;
    --good:#12805c; --good-bg:#e6f6ef;
    --ok:#2f6feb; --ok-bg:#eaf1ff;
    --warn:#9a6700;--warn-bg:#fff4d6;
    --bad:#b42318; --bad-bg:#fdecea;
    --radius:14px;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#14161a;--card:#1c1f25;--ink:#e8eaed;--muted:#9aa3ad;--line:#2c3138;
      --brand:#7aa2ff;--brand-soft:#1e2a44;--good:#4ade80;--good-bg:#132a20;
      --ok:#7aa2ff;--ok-bg:#1e2a44;--warn:#fbbf24;--warn-bg:#33280f;--bad:#f87171;--bad-bg:#3a1715;}
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:820px;margin:0 auto;padding:18px 16px 64px}
  header.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  header.top h1{font-size:18px;margin:0}
  .badge{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:2px 9px}
  .stats{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  select,button{font:inherit}
  select{appearance:none;background:var(--card);color:var(--ink);border:1px solid var(--line);
    border-radius:10px;padding:8px 30px 8px 11px;font-size:14px;max-width:100%;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:1px 9px}
  .chip.t{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 40%,transparent)}
  .counter{margin-left:auto;font-variant-numeric:tabular-nums}
  .stem{font-size:20px;line-height:1.6;font-weight:600;margin:4px 0 14px;word-break:break-word}
  textarea{width:100%;min-height:160px;resize:vertical;padding:13px 14px;border-radius:12px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;line-height:1.7}
  textarea:focus{outline:2px solid color-mix(in srgb,var(--brand) 35%,transparent);outline-offset:1px;border-color:var(--brand)}
  .actions{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0 16px}
  button.btn{border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:10px 16px;cursor:pointer;font-size:15px}
  button.btn:active{transform:translateY(1px)}
  button.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  button.btn.ghost{background:transparent}
  button.btn:disabled{opacity:.45;cursor:not-allowed}
  .kbd{font-size:12px;opacity:.7;margin-left:6px}
  .result{border-top:1px dashed var(--line);padding:16px 0 6px;margin-top:4px}
  .score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .score .num{font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .score .num small{font-size:15px;font-weight:600;color:var(--muted)}
  .tag{border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600}
  .tag.good{color:var(--good);background:var(--good-bg)}
  .tag.ok{color:var(--ok);background:var(--ok-bg)}
  .tag.warn{color:var(--warn);background:var(--warn-bg)}
  .tag.bad{color:var(--bad);background:var(--bad-bg)}
  .score .sub{font-size:13px;color:var(--muted);flex:1 1 100%}
  .kps{list-style:none;padding:0;margin:16px 0 4px}
  .kps li{display:flex;gap:9px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
  .kps li:first-child{border-top:0}
  .kps .ico{flex:0 0 18px;font-size:14px;line-height:1.9}
  .kps .cov{font-size:12px;color:var(--muted);margin-left:6px;white-space:nowrap}
  .kps mark{background:transparent;color:var(--bad);font-weight:700;border-bottom:2px solid color-mix(in srgb,var(--bad) 55%,transparent)}
  .answer{margin-top:14px;background:var(--brand-soft);border-radius:12px;padding:13px 15px;font-size:15px}
  .answer h3{margin:0 0 6px;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
  .answer p{margin:0;white-space:pre-wrap}
  .warnbar{margin:0 0 14px;padding:10px 13px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:13px;line-height:1.55}
  .note{font-size:12.5px;color:var(--muted);margin:12px 0 0;line-height:1.6}
  .nav{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
  .nav .spacer{flex:1}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);
    background:#111;color:#fff;padding:9px 15px;border-radius:10px;font-size:14px;
    opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90vw}
  .toast.show{opacity:.95;transform:translateX(-50%) translateY(0)}
  footer.foot{margin-top:22px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
  footer.foot button{background:none;border:0;color:var(--muted);text-decoration:underline dotted;cursor:pointer;padding:0;font-size:12px}
  @media (max-width:560px){
    .wrap{padding:14px 14px calc(26px + env(safe-area-inset-bottom))}
    .stats{width:100%;margin-left:0;font-size:12.5px}
    .filters select{flex:1 1 calc(50% - 7px);min-width:0;min-height:46px;font-size:16px}
    .filters select:first-child{flex:1 1 100%}
    .kbd{display:none}
    .card{padding:16px 15px}
    .stem{font-size:18px}
    textarea{min-height:160px;font-size:17px}
    button.btn{min-height:48px;font-size:16px;flex:1 1 auto}
    button.btn.primary{flex:1 1 100%}
    .nav .btn{flex:1 1 46%}
    .nav .spacer{display:none}
    .kps li{font-size:15.5px}
    .toast{bottom:calc(18px + env(safe-area-inset-bottom))}
  }
  button,select,a,textarea{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  button{-webkit-touch-callout:none;user-select:none}
  select,textarea{font-size:16px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="title">真题速刷</h1>
    <span class="badge">扫描件原文 · 可能有错字</span>
    <span class="stats" id="stats"></span>
  </header>

  <div class="filters">
    <select id="f-year" aria-label="年份"></select>
    <select id="f-type" aria-label="题型">
      <option value="all">全部题型</option>
      <option value="名词解释">名词解释</option>
      <option value="简答">简答</option>
      <option value="论述">论述 / 综合</option>
    </select>
    <select id="f-mode" aria-label="顺序">
      <option value="seq">按顺序</option>
      <option value="random">随机</option>
      <option value="new">只刷没做过的</option>
      <option value="wrong">只刷错题</option>
    </select>
  </div>

  <p class="warnbar" id="warnbar">题目和答案都是从 <b>扫描件 OCR</b> 来的，会有错字（「干扰」可能识别成「千扰」、「足迹」成「促迹」）。判分只数覆盖，<b>以参考答案为准</b>。</p>

  <main class="card">
    <div class="meta">
      <span class="chip" id="c-year"></span>
      <span class="chip t" id="c-type"></span>
      <span class="chip" id="c-no"></span>
      <span class="counter" id="c-counter"></span>
    </div>
    <div class="stem" id="stem">—</div>

    <textarea id="input" placeholder="先自己写一遍，再对照参考答案" spellcheck="false"></textarea>

    <div class="actions">
      <button class="btn primary" id="btn-submit">提交判分<span class="kbd">Ctrl+↵</span></button>
      <button class="btn" id="btn-reveal">直接看答案</button>
      <button class="btn ghost" id="btn-skip">跳过</button>
    </div>

    <section class="result" id="result" hidden>
      <div class="score">
        <div class="num" id="r-score">0<small>%</small></div>
        <span class="tag" id="r-tag">—</span>
        <span class="sub" id="r-sub"></span>
      </div>
      <ul class="kps" id="r-kps"></ul>
      <div class="answer">
        <h3>参考答案（OCR 原文，未校对）</h3>
        <p id="r-answer"></p>
      </div>
      <p class="note">覆盖率只是「你写到的要点占参考答案的比例」，不是得分——真题没有标准采分点表，别把百分数当分数看。</p>
    </section>

    <div class="nav">
      <button class="btn ghost" id="btn-prev">← 上一题</button>
      <span class="spacer"></span>
      <button class="btn" id="btn-next">下一题 →</button>
    </div>
  </main>

  <footer class="foot">
    <button id="btn-wrongbook">错题本（<span id="wrong-count">0</span>）</button>
    <button id="btn-reset">清空进度</button>
    <span id="foot-meta"></span>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>/*
 * 判分核心（两个练习器共用：名词解释 / 简答）
 * 纯本地：不联网、不调用任何模型、不花 token。
 * 会被内联进各自的 HTML，也供 build.mjs / selftest.mjs 在 node 里 require（通过 globalThis.GradeCore）。
 *
 * 共同思路：
 *   1. 归一化（全半角、大小写、去空白标点）
 *   2. 把标准答案切成「要点」
 *   3. 每个要点的覆盖度 = 它的「二字片段（bigram）」被学习者作答命中的比例
 *   4. 覆盖 70% 即视为该要点拿满分
 *
 * 两个入口：
 *   grade(def, answer)                    名词解释：整条定义切要点，百分制
 *   gradePoints(points, answer, fullMark)  简答：按「采分点」给分，满分 8 分制
 */
(function () {
  'use strict';

  var PUNCT = /[\s\u3000，。；：、！？·—－–\-_/\\|~`!@#$%^&*+=:;,.?'"“”‘’（）()\[\]【】《》<>…]/g;

  function normalize(s) {
    return String(s == null ? '' : s)
      .normalize('NFKC')
      .toLowerCase()
      .replace(PUNCT, '');
  }

  function bigrams(s) {
    var set = new Set();
    if (!s) return set;
    if (s.length === 1) { set.add(s); return set; }
    for (var i = 0; i < s.length - 1; i++) set.add(s.slice(i, i + 2));
    return set;
  }

  // 定义 → 要点列表（保留原文，用于展示）
  // 只在 。；和过长的逗号句处切，等号（本质＝…、公式 N = …）一律原样留着，
  // 否则「本质」这类标签会被切出来当成独立要点，判分时会误报「漏了本质」。
  function splitKeypoints(def) {
    var raw = String(def == null ? '' : def).trim();
    if (!raw) return [];
    var parts = raw.split(/[；;。]/).map(function (s) { return s.trim(); }).filter(Boolean);
    var out = [];
    parts.forEach(function (p) {
      if (normalize(p).length <= 46) {
        out.push(p);
      } else {
        p.split(/[，,]/).map(function (s) { return s.trim(); }).filter(Boolean)
          .forEach(function (x) { out.push(x); });
      }
    });
    // 过短的碎片并回上一条
    var merged = [];
    out.forEach(function (piece) {
      var n = normalize(piece).length;
      if (n === 0) return;
      if (n < 8 && merged.length) {
        merged[merged.length - 1] = merged[merged.length - 1] + '，' + piece;
      } else {
        merged.push(piece);
      }
    });
    return merged;
  }

  // 逐字标记「作答里没有覆盖到的部分」，用于展示差在哪里
  function markMissing(text, ansGrams) {
    var segs = [];
    var i = 0;
    while (i < text.length) {
      var g = text.slice(i, i + 2);
      var miss = i < text.length - 1 ? !ansGrams.has(g) : true;
      if (!segs.length || segs[segs.length - 1].miss !== miss) segs.push({ t: text[i], miss: miss });
      else segs[segs.length - 1].t += text[i];
      i++;
    }
    return segs;
  }

  function levelOf(score) {
    if (score >= 85) return { label: '优秀', tone: 'good', tip: '基本能默写了' };
    if (score >= 70) return { label: '良好', tone: 'ok', tip: '主干对了，补上标红的部分' };
    if (score >= 55) return { label: '及格', tone: 'warn', tip: '要点缺得比较多，建议今天再刷一遍' };
    return { label: '待加强', tone: 'bad', tip: '先把标准答案读两遍，再回头重写' };
  }

  // 一个要点对一份作答的覆盖情况
  function coverageOf(text, ansNorm, ansGrams) {
    var kn = normalize(text);
    var kg = bigrams(kn);
    var hit = 0;
    if (kn.length <= 1) {
      hit = kn && ansNorm.indexOf(kn) >= 0 ? 1 : 0;
      kg = new Set([kn || ' ']);
    } else {
      kg.forEach(function (g) { if (ansGrams.has(g)) hit++; });
    }
    var cov = kg.size ? hit / kg.size : 0;
    return { cov: cov, mark: markMissing(text, ansGrams) };
  }

  // —— 名词解释：整条定义切要点，百分制 ——
  function grade(def, answer) {
    var kps = splitKeypoints(def);
    var ansNorm = normalize(answer);
    var ansGrams = bigrams(ansNorm);
    var totalW = 0, gotW = 0;
    var items = kps.map(function (k) {
      var c = coverageOf(k, ansNorm, ansGrams);
      var w = Math.max(normalize(k).length, 2);
      var credit = Math.min(1, c.cov / 0.7);
      totalW += w;
      gotW += w * credit;
      return {
        text: k,
        coverage: Math.round(c.cov * 100),
        status: c.cov >= 0.6 ? 'hit' : (c.cov >= 0.3 ? 'part' : 'miss'),
        mark: c.mark
      };
    });
    var score = totalW ? Math.round((gotW / totalW) * 100) : 0;
    if (!ansNorm) score = 0;
    return {
      score: score,
      level: levelOf(score),
      items: items,
      hitCount: items.filter(function (i) { return i.status === 'hit'; }).length,
      totalCount: items.length,
      chars: ansNorm.length,
      empty: !ansNorm
    };
  }

  // —— 简答：按采分点给分，满分默认 8 分 ——
  // points: [{ label, body }]，来自题库解析；分值按要点字数分配，最小 0.5
  function allocatePoints(points, fullMark) {
    var weights = points.map(function (p) { return Math.max(normalize(p.label + p.body).length, 2); });
    var total = weights.reduce(function (a, b) { return a + b; }, 0);
    var scores = weights.map(function (w) { return Math.max(0.5, Math.round((w / total) * fullMark * 2) / 2); });
    var sum = scores.reduce(function (a, b) { return a + b; }, 0);
    var diff = Math.round((fullMark - sum) * 2) / 2;
    if (diff !== 0 && scores.length) {
      var maxIdx = scores.indexOf(Math.max.apply(null, scores));
      scores[maxIdx] = Math.max(0.5, scores[maxIdx] + diff);
    }
    return scores;
  }

  function gradePoints(points, answer, fullMark) {
    fullMark = fullMark || 8;
    var ansNorm = normalize(answer);
    var ansGrams = bigrams(ansNorm);
    var alloc = allocatePoints(points, fullMark);
    var got = 0;
    var items = points.map(function (p, i) {
      var text = p.label ? p.label + '：' + p.body : p.body;
      var c = coverageOf(text, ansNorm, ansGrams);
      if (!ansNorm) c.cov = 0;
      var status = c.cov >= 0.6 ? 'hit' : (c.cov >= 0.3 ? 'part' : 'miss');
      // 判成「漏」就一分不给，否则会出现「❌ 0.5/1.5 分」这种自相矛盾的展示
      var credit = status === 'miss' ? 0 : Math.min(1, c.cov / 0.7);
      got += alloc[i] * credit;
      return {
        no: i + 1,
        label: p.label || '',
        body: p.body,
        full: alloc[i],
        got: Math.round(alloc[i] * credit * 2) / 2,
        coverage: Math.round(c.cov * 100),
        status: status,
        // 标红只覆盖正文：标签在界面上单独加粗显示，重复标一次会看起来像复制粘贴
        mark: markMissing(p.body, ansGrams)
      };
    });
    var score = Math.round(Math.min(got, fullMark) * 2) / 2;
    var ratio = fullMark ? score / fullMark : 0;
    var count = function (s) { return items.filter(function (i) { return i.status === s; }).length; };
    return {
      score: score,
      fullMark: fullMark,
      ratio: ratio,
      level: levelOf(ratio * 100),
      items: items,
      hitCount: count('hit'),
      partCount: count('part'),
      missCount: count('miss'),
      totalCount: items.length,
      chars: ansNorm.length,
      empty: !ansNorm
    };
  }

  globalThis.GradeCore = {
    normalize: normalize,
    bigrams: bigrams,
    splitKeypoints: splitKeypoints,
    coverageOf: coverageOf,
    grade: grade,
    gradePoints: gradePoints,
    allocatePoints: allocatePoints,
    levelOf: levelOf
  };
})();
</script>
<script>const DATA = {"meta":{"years":["2022","2023","2024"],"total":49,"builtAt":"2026-11-08","source":"基因工程真题及答案解析.pdf"},"items":[{"id":"2022-名词解释-1","year":"2022","type":"名词解释","no":1,"stem":"蛋白质定向进化","answer":"书 P183 ） 定向进化是在试管中模拟达尔文进化过程 ， 通过随机突变和重组 ， 人为制造大量的突变 ， 按照特定的需要和目的给予选择压力 ， 筛选出具有期望特征的蛋白质 ， 实现分子水平的模拟进化 。 这是改善蛋白质性能最有前途的方法 。 定向进化的发展拓宽了蛋白质工程的设计范围 ， 可在未知目标蛋白质结构信息和作用机制的情况下对蛋白质进行改造 。"},{"id":"2022-名词解释-2","year":"2022","type":"名词解释","no":2,"stem":"inverse PCR","answer":"书 P140 ） 反向 PCR 是一种简单的扩增已知序列周边未知序列的方法 。 首先用已知片段内部没有的限制性内切酶切割模板 DNA ， 再将酶切后的 DNA 片段连接成环状分子 ， 其中至少有一个环状分子含有完整的已知片段 。 根据己知片段两端的序列设计反向引物 ， 可将邻近的 DNA 片段扩增出来 。"},{"id":"2022-名词解释-3","year":"2022","type":"名词解释","no":3,"stem":"RNAi","answer":"RNAi （ 书 P123 ） RNA 千扰现象又称转录后基因沉默 ， 是指在进化过程中高度保守的 、 由双链 RNA(dsRNA) 诱发的 、 同源 mRNA 高效特异性降解的现象 。 RNAi 的主要过程是 dsRNA 被核酸酶切割成 25 nt 的干扰性小 RNA （ siRNA) ， 由 siRNA 介导识别并靶向切割同源性靶 mRNA 分子 。"},{"id":"2022-名词解释-4","year":"2022","type":"名词解释","no":4,"stem":"穿梭载体","answer":"穿梭载体 （ 书 P92 ） 穿梭载体就是能够在两类不同宿主中复制 、 增殖和选择的载体 ， 如有些载体既能在原核细胞中复制又能在真核细胞中复制 ， 或能在大肠杆菌中复制又能在革兰氏阳性细菌中复制 。 这类载体主要是质粒载体 。 由于复制和选择都是有宿主专一性的 ， 因此穿梭载体至少含有两套复制单元和两套选择标记 ， 相当于两个载体的联合 。"},{"id":"2022-名词解释-5","year":"2022","type":"名词解释","no":5,"stem":"基因治疗","answer":"基因治疗 （ 书 P5 ） 将健康基因移植到相关组织或细胞可使遗传患者的症状减缓甚至消失 ， 这种治疗措施就称为基因治疗 （ gene therapy) 。 基因治疗包括基因修正 、 基因替换和基因增补 。 首先将与疾病有关的正常基因分离和克隆 ， 然后通过反转录病毒等把足量正常基因送入患者有关组织细胞内 ， 并使其在患者体内正确表达 。 基因治疗作为基因工程的一个分支 ， 与典型的基因工程有明显的区别 。 基因治疗不会导致生命个体遗传性状的改变 ， 只是某个组织或细胞获得了新的外来性状 ， 不会传给下一代 。"},{"id":"2022-简答-1","year":"2022","type":"简答","no":1,"stem":"简要说明 DNase I 足迹实验 (DNase I footprinting assay) 。","answer":"Nase 促迹实验 (DNase 1 footprinting assay ） 是一种用来检测与蛋白质特异性结合的 DNA 片段的位置及其核苷酸序列结构的实验方法 。 该方法常与 EMSA 法结合共同用于体外 DNA · 蛋白质相互作用的鉴定 。 但二者的侧重点不同 ， EMSA 主要用于检测 DNA 与蛋白质是第 6 页共 106 页备考公众号 ： 求臻生物考研 否结合 ； 而 DNase 丨足迹实验检测 DNA 中与蛋白质结合的部位 。 该方法用 DNase 嘟分消化已进行单链末端标记的待测双链 DNA （ 通过控制酶的浓度 ， 使每个标记的 DNA 单链平均被切割一次 ） ， 形成在变性聚丙烯酰胺凝胶上以相差一个核苷酸为梯度的 DNA 条带 。 但当 DNA 片段与某蛋白结合后 ， 该蛋白就阻碍 DNase 丨在 DNA 结合位点及其周围部位的结合 ， DNase | 将不能在结合蛋白质的部位切割 DNA ， 形成切割梯中的空白区域 ， 俗称为 “ 足迹 \" 。 以该片段的 DNA 测序条带作为相对分子质量标记 ， 就可知该结合区的碱基序列 。"},{"id":"2022-简答-2","year":"2022","type":"简答","no":2,"stem":"如何对 DNA 进行末端补平和标记 ？","answer":"第二版课本 P123 ， 新版该部分有删减改动 ） DNA 片段的末端标记主要通过酶促反应来完成 ， 但标记的方式很多 。 如 Klenow DNA 聚合酶和 T4 或肓 DNA 聚合酶在对 DNA 片段进行末端补平反应或平末端的置换反应时可引入标记的核苷酸 ， 交换 （ 置换 ） 反应即如果只有一种 dNTP 存在 ， 3 5 ' 外切核酸酶活性将从 3 ' ℃ H 端降解 DNA ， 然后在该位置发生一系列连续的合成和外切反应 ， 直到露出与该 dNTP 互补的碱基 。 总之 ， 在没有 dNTP 的情况下 ， 外切活性占主导地位 ， 而当存在足够的 dNTP 时 ， 外切活性和合成活性将处在动态平衡中 ， 结果使得双链 DNA 成为平末端 。 T4 多核苷酸激酶可在 DNA 的 5 ' 端引入标记的磷酸基团或将 5 ' 端的磷酸基团用标记的磷酸基团置换 。 末端转移酶可在 DNA 的 3 ' 端连接标记的核苷酸 。"},{"id":"2022-简答-3","year":"2022","type":"简答","no":3,"stem":"简述酵母双杂交原理及具体方法 。","answer":"书 P203 ） 酵母双杂交系统是一种具有很高灵敏度的研究蛋白质之间关系的技术 。 反式转录激活因子 ， 往往由两个或两个以上结构上可以分开 ， 功能上相互独立的结构域构成 ， 其中有 DNA 结合功能域但 D ） 和转录激活结构域 D ） 。 将这两个结合域分开时不能激活相关基因的转录 ， 只有当被分开的两者通过适当的途径在空间距离上较为接近时 ， 才能形成有功能的转录因子 ， 从而启动下游基因的转录 。 根据这个特性 ， 将编码 BD 的基因与己知蛋白 x 的基因构建在同一个表达载体上 ， 形成融合蛋白 BD · X ， 并以含有 BD · X 融合蛋白和报告基因的细胞为构建文库的受体菌 ： 而将编码 AD 的基因和目的蛋白 Y 的基因构建融合基因文库 ， 产生融合蛋白 AD-YO 同时将上述两种载体转化改造后的酵母 ， 表达两者的融合蛋白 。 当上述两种载体所表达的融合蛋白能够相互作用时 ， 功能重建的反式作用因子能够激活含有 BD 结合位点的启动子下游报告基因的表达 ， 从而通过功能互衤卜和显色反应筛选到阳性菌落 ， 研宄活细胞内蛋白质相互作用 。"},{"id":"2022-简答-4","year":"2022","type":"简答","no":4,"stem":"简述 T7 启动子控制的 PET 载体的原理 ， 怎样表达杀虫蛋白以及验证 ？","answer":"书 P82 （ 1 ） PET 表达载体的组成是在质粒载体的基本结构上加入了 T7 噬菌体启动子序列及其下游的几个酶切位点 。 当外源基因插入到这些酶切位点后 ， 就可在特定的宿主细胞中诱导表达 。 噬菌体启动子只能由 T7 噬菌体的 RNA 聚合酶识别并启动转录 ， 而大肠杆菌的 RNA 聚合酶不能作用于 T7 噬菌体启动子 。 因此要求用于表达的宿主细胞必须能表达 T7 噬菌体的 RNA 聚合酶 。 大肠杆菌 BL21 （ DE3 ） 是常用的 PET 表达载体的宿主菌 ， 该菌对 T7 RNA 聚合酶和目的基因的转录实行多层次的调控 。 在该菌株染色体的 BL21 区整合有一个入噬菌体 DNA ， 在入噬菌体的 DE3 区有一个 T7 RNA 聚合酶基因 （ T7 基因 I ） ， 该基因爿 acUV5 启动子控制 。 当 PET 载体进入 BL21 （ DE3 ） 细胞后 ， 由于宿主细胞的 lacl 基因表达产生阻抑物 ， 从第 7 页共 106 页备考公众号 ： 求臻生物考研 而抑制 T7 RNA 聚合酶基因的表达 ， 在载体上的目的基因也无法启动表达 。 当存在 IPTG 诱导物后 ， 使阻抑物失去阻抑作用 ， T7 RNA 聚合酶基因得以表达 ， 产生 T7 RNA 聚合酶 ， 从而启动 T7 启动子控制的外源基因的表 （ 2 ） 表达杀虫蛋白的方法 ： 首先找到并克隆出杀虫蛋白的基因 ， 将该基因插入 PET 载体上 T7 启动子的下游 ， 再转入对应的大肠杆菌 BL21 (DE3) ， 平时不会表达该基因 ， 需要得到杀虫蛋白时 ， 加入 | PTG 诱导 ， 解除大肠杆菌基因组上关于 RNA 聚合酶编码基因的抑制 ， 在大肠杆菌 RNA 聚合酶的作用下 ， 产生 T7 RNA 聚合酶 ， T7 RNA 聚合酶再与 PET 载体上的 T7 启动子结合 ， 启动其下游基因即杀虫基因的表达 。 最后再将杀虫蛋白利用亲和层析等方法分离纯化出来 。 验证产物蛋白的方法 ： 将目标昆虫分成实验组和对照组 ， 将含蛋白的食物喂给实验组昆虫 ， 喂给对照组昆虫不含 c 蛋白的同样食物 ， 观察其与对照组的区别以验证其活性 。 产物蛋白还可以通过凯氏定氮法能计算出样品中的蛋白质含量 ， 用双缩脲法测肽链的量 ， 用紫外分光光度计测定波长为 280nm 光的吸收值 ， 确定其理化性质以进一步验证产物蛋白组成成分 。"},{"id":"2022-简答-5","year":"2022","type":"简答","no":5,"stem":"动植物细胞转基因 4 种方法及原理 。","answer":"书 P250 、 285 ） 显微注射法 ： 先利用琼脂糖包埋法 、 多聚 L 嗽氨酸黏连法 、 吸管支持法等方法对受体细胞进行固定 ， 再使用显微注射仪将外源 DNA 直接注入受体的细胞质或细胞核中 ， 从而实现外源基因的转移 。 激光微束法 ： 将激光引入光学显微镜聚焦成微米级的微束照射培养细胞 ， 在细胞膜上形成能自我愈合的小孔 ， 使加入细胞培养基里的外源 DNA 流入细胞 ， 实现基因的转移 。 电激法 ： 是利用高压电脉冲作用 ， 在细胞膜上 “ 电激穿孔 \" ， 形成可逆的瞬间通道 ， 从而促进外源 DNA 进入细胞 。 基因枪法 ： 将外源 DNA 包被在微小的金粒或钨粒表面 ， 然后在高压的作用下将微粒高速射入受体细胞或组织 。 微粒上的外源 DNA 进入细胞后 ， 整合到染色体上并得到表达 ， 从而实现外源基因的转化 。"},{"id":"2022-论述-1","year":"2022","type":"论述","no":1,"stem":"Cas9 ℃ RISPR 是什么 ？ 有哪些关键元件 ？ 原理是什么 ？ 潜在应用有哪些 ？","answer":"书 P237 ） （ 1 ） 定义 ： 有一种细菌编码的核酸酶 Cas9 能够利用向导 RNA(guide RNA ） 分子对特定的 DNA 片段进行定向切割 ， 人们利用这种特点开发出了一种能够对基因组进行特异性定点改造的工具 ， 即 CR 丨 SPR 基因组编辑技术 。 （ 2 ） 关键元件 ： CRISPR 序列 ： 在细菌和古细菌中存在的很多成簇的 、 规律间隔的短回文重复序列 。 cas9 内切酶 ： 能够利用向导 RNA(guide RNA ） 分子对特定的 DNA 片段进行定向切割的内切酶 。 PAM 位点 ： 由 3 个碱基组成的可被 Cas9 识别的位点 ， 可使 Cas9 作用于 crRNA 与外源 DNA 配对的区域 ， 并切割外源双链 DNA ， 最终导致外源 DNA 降解 。 sgRNA ： 向导 RNA 由三个部分组成 ， 一个可变的 20 nt 的区域 ， 其转录产物可以用于与待切割的靶标 DNA 进行配对 ； 一个 42 nt 的发夹结构 ， 其转录产物相当于上面所述的双链第 8 页共 106 页备考公众号 ： 求臻生物考研 RNA ， 可于与 cas9 蛋白特异性结合 ， 形成切割复合体 ； 一个 40 nt 的转录终止子 ， 用于 sgRNA 的转录终止 。 （ 3 ） 主要原理 ： cas9 内切酶能特异性识别由 3 、 6 个碱基组成的 PAM 位点 ， 并对该位点附近的双链分子进行切割 。 cas9 内切酶在切割之前需形成 cas9 切割复合体 。 亦即 Cas ： 一个特定的双链 RNA 分子结合形成复合体 ， 这个双链 RNA 就相当于 CRISPR 系统中的 crRNA 和 tracrRNA 。 在实际操作过程中可将这双链 RNA “ 改装 \" 成一个向导 RNA （ 引 ng ] e · guide RNA ， sgRNA)o Cas9 蛋白载体能够在目标细胞中表达 cas9 蛋白 ， 而构建的 sgRNA 载体能够在目标细胞中转录形成 sgRNAO sgRNA 能够与目标 DNA 序列中的非模板链发生互补配对 ， 这样 cas9 蛋白能够识别目标 DNA 序列中的 PAM 位点和 sgRNA 与非模板链 DNA 构成的复合体 ， 并与之结合形成切割复合物 ， 导致目标序列双链被切割 。 细胞通常会通过两种方式对发生双链断裂的 DNA 进行修复 。 在修复的过程中细胞有可能会对修复位点进行修饰 ， 或者插入新的遗传信息 ， 以逃避再次的被切割 。 研宄表明细胞更倾向于通过同源重组机制进行修复 ， 如果我们对用于修复的模板 DNA 进行体外设计 ， 就可以通过同源重组修复机制将突变的模板序列导入基因组 ， 从而实现对基因组的定向编辑功能 。 （ 4 ） 潜在应用 ： 通过对 Cas9 蛋白进行改造 ， 使得 Cas9 蛋白失去了核酸内切酶活性仅具有 PAM 位点和 crRNA 与外源 DNA 配对复合体的识别结合活性 ， 从而构建了一个新的可同时用于多个基因和顺式作用元件沉默的 CR | SPRi 系统 。 改造的 dCas9 蛋白载体能够在标细胞中表达 dCas9 蛋白 ， 而 sgRNA 载体能够在目标细胞中转录形成 sgRNA 。 sgRNA 能够与目标 DNA 序列中的非模板链发生互补配对识别 ， dCas9 蛋白能够识别目标 DNA 序列中的 PAM 位点和 sgRNA 与非模板链 DNA 构成的复合体 ， 并与之结合阻碍 RNA 聚合酶对模板链的结合导致目标序列不能够正常进行转录起始和 mRNA 的延伸 ， 最终使得目的基因或是顺式元件沉默 。"},{"id":"2022-论述-2","year":"2022","type":"论述","no":2,"stem":"如果用基因工程技术研发重组蛋白疫苗类型的新冠疫苗 ， 请针对基因工程制药的基本环节 ， 写一个以哺乳动物细胞为表达系统的技术路线","answer":"。 （ 1) 基因工程药物的制备基本流程 ： 载体构建 、 工程菌或细胞培养 、 目的产物的分离纯化与鉴定等 。 （ 2 ） 设计重组蛋白类型的新冠疫苗哺乳动物系统制备方法 ： 先选定具有免疫原性的新冠肺炎病毒表面抗原基因片段 ， 将其插入表达载体 ， 并引入重组中国仓鼠卵巢细胞 (CH"},{"id":"2022-论述-3","year":"2022","type":"论述","no":3,"stem":"杂交与转基因的异同之处 ， 并劝说家人相信转基因 。","answer":"书 P404 ） （ 1 ） 相同点 ： 转基因技术与传统技术的本质都是通过获得优良基因进行遗传改良 ， 都涉及到基因的重新组合和利用 。 （ 2 ） 不同点 ： 传统技术一般只能在生物种内个体上实现基因转移 ， 而转基因技术不受生物体间亲缘关系的限制 ， 可打破不同物种间天然杂交的屏障 ， 扩大可利用基因的范围第 9 页共 106 页备考公众号 ： 求臻生物考研 传统的杂交和选择技术一般是在生物个体水平上进行 ， 操作对象是整个基因组 ， 不可能准确地对某个基因进行操作和选择 ， 对后代的表现预见性较差 。 而转基因技术所操作和转移的一般是经过明确定义的基因 ， 功能清楚 ， 后代表现可准确预期 。 （ 3 ） 如何劝说 ： 转基因技术的确是有风险的 ， 但并不是有害的 。 事实上任何人类活动都有风险 ， 任何科学技术发明都是一把双刃剑 ， 既有有利的一面 ， 也有不利的一面 ， 最重要的是要权衡利弊 ， 取其利 ， 避其弊 。 电器 、 汽车 、 飞机 、 青霉素等等都不是绝对保险 ， 触电伤人 ， 汽车尾气造成空气污染 ， 空难以及青霉素过敏等事件 ， 人们己经是屡见不鲜 。 如果害怕以转基因技术为主的生物技术研究可能带来的负面效应 ， 而禁止其发展 ， 必将蒙受巨大损失 ， 甚至在国际竞争中败下阵来 。 对于任意一项科学技术 ， 零风险是不存在的 ， 也没有什么绝对安全 ， 但是因噎废食 ， 无所作为才是最大的风险 。 就比如说转基因抗病虫害作物 ， 看似给人们和环境带来了异源基因的潜在威胁 ， 但是其也减少了农药的使用 ， 维护了食用者的健康 ， 同时也保护了生态环境 ， 降低了生产成本 ， 提升了农民收入 。 所以我们不能因为未知的风险而放弃眼前的利益 。 科学技术是没有好坏之分的 ， 重要的是看我们如何去使用 。 我相信随着科学进步 ， 转基因技术也将趋于成熟 ， 不断减小风险 ， 给全世界的人民带来更大的利益 。"},{"id":"2022-论述-4","year":"2022","type":"论述","no":4,"stem":"知道大豆耐盐基因的序列 ， 怎么克隆出来 ？ 克隆出来以后怎么用于生产优良大豆品种 ？","answer":"1 ） 根据大豆耐盐基因的已知序列设计引物 ， 利用该引物进行 PCR 扩增 ， 扩增产物即为大豆耐盐基因的克隆 。 （ 2 ） 将扩增产物与带有抗生素抗性基因标记的载体连接 ， 将载体利用基因枪法或者是根瘤农杆菌介导法转入大豆受体细胞内 ， 再用对应的抗生素筛选出成功转入了载体的受体细胞 ， 对这些细胞进行组织培养 ， 长成植株后移栽到高盐的土地上 ， 能够正常生长的大豆植株则是成功转入了耐盐基因的优良大豆品种 。"},{"id":"2023-名词解释-1","year"  BAC ， YAC ， 黏粒 ， PI 噬菌体载体 ， 而利用转导方式导入宿主细胞的是黏粒和 PI 噬菌体载体 。 （ 课本 70 ）"},{"id":"2023-简答-1","year":"2023","type":"简答","no":1,"stem":"互补的原理第 11 页共 106 页备考公众号 ： 求臻生物考研 locZ 谝碣失第 1 ] 、 位基","answer":"a 互补的原理第 15 页共 106 页备考公众号 ： 求臻生物考研 大肠什 F 质谝码失 II 一 4 1 位基"},{"id":"2023-简答-2","year":"2023","type":"简答","no":2,"stem":"结合酵母单杂交技术原理和操作步骤 （ 题太长记不清了 ）","answer":"· 结合酵母单杂交技术原理和操作步骤 （ 题太长记不清了 ） 酵母单杂交技术是根据 DNA 结合蛋白 （ 即转录因子 ） 与 DNA 顺式作用元件结合调控报道基因表达的原理来克隆编码目的转录因子的基因 。 用于酵母单杂交系统的酵母 GAL4 蛋白即是一种典型的转录因子 ， 研宄表明 GAL4 的 DNA 结合结构域可激活酵母半乳糖苷酶的上游激活位点 （ UAS ） ； 一而激活结构域可与 RNA 聚合酶或转录因子 TFIID 相互作用 ， 提高 RNA 聚合酶的活性 。 在这一过程中 1 ， DNA 结合结构域和激活结构域可完全独立地发挥作用 。 据此 0 可将 G A L4 的 DNA 结合结构域置换为其他蛋白 ， 只要它能与我们想了解的目的基因相互作用 ， 就照样可以通过其转录激活结构域激活 RNA 聚合酶 ， 从而启动对下游报告基因的转录 。 正是基于这一理论 ， 酵母单杂交系统由 2 部分 组成 ： （ 1) 将文库蛋白片段与 GAL4 转录激活域融合表达的 cDNA 文库质粒 ； （ 2 ） 含有目的基因和下游报告基因的报告质粒 。 在实验中 ， 首先将报告质粒整合入酵母基因组 ， 产生带有目的基因的酵母报告株 ； 再将文库质粒转化入报告株 ； 若存在文库蛋白与目的基因的相互作用 ， 可通过对报告基因的表达将文库蛋白的基因筛选出来 。"},{"id":"2023-简答-3","year":"2023","type":"简答","no":3,"stem":"A 、 熟知性原则 B 实质等同性个案分析原则 DO 预防原则","answer":"（ 多选 ） 转基因作物环境风险评价原则 ， 普遍采用的原则 (BC) A ， 熟知性原则 B ， 实质等同性 c ， 个案分析原则 D ， 预防原则"},{"id":"2023-简答-3","year":"2023","type":"简答","no":3,"stem":"何种技术实现待测蛋白与 GFP 蛋白的融合表达 （ 题也长 ， 介绍了 GFP)","answer":"题也长 ， 介绍了 GFP) 应用亚克隆技术将目的基因与 GFP 基因构建成融合基因 ， 通过愈伤组程转化法 、 基因枪 、 显微注射 、 电激转化等方法到合适的细胞 ， 利用目的基因的表达调整机制 ， 如启动子和信号序列来控制融合基因的表达 ， 最终得到融合蛋白 （ 尽可能不影响目的意白的定值和功能 ） 。 目的蛋白与 GFP 基因融合方式 ： ． 目的基因 FP （ 将 GFP 置于目的基因之后 ） @GFP- 目的基因 （ 将 GFP 置前 ） · 注意事项 ： ． 两个基因之间用 Linker 连接 @在两个基因交接处增加一段核苷酸 〈 3 的倍数 ） 使两个基因的蛋白产物的空间结构相互影响较小 ， 有利于 GFP 发光 @基因在 GFP 之前时必须要有超始密码子不能有终止密码 ， 基因在 GFP 必须要有终止密码 @构建融合基因后 ， 须测测序进行验证 ， 确保融合基因读框正确 。 GFP 融合蛋白的检测 ： ． 定性检测 ： 可以用常规的落射荧光显微镜 / 共骤焦显微镜观察 @定量检测 ： 免疫印迹法 、 酶联免疫吸附诺 · O 可以在活细胞中进图像分析 ， 也可捡测固定细胞中的 GFP"},{"id":"2023-简答-4","year":"2023","type":"简答","no":4,"stem":"Primer extension 技术可以用来 A. 基因突变 B ， 克隆大片段 DNA C 啭录起始位点 DO cDNA 末端","answer":"* 端"},{"id":"2023-简答-4","year":"2023","type":"简答","no":4,"stem":"4 种克服转基因失活策略","answer":"克服转基因的失活有如下策略 ： （ 1 ） 选择单拷贝的转基因株系 。 可以在转基因再生植株的当代选择 ， 也可以从多拷贝整合植株的有性繁殖分离后代中选择 。 切实可行的途径是选择适宜的转基因方法 ， 提高单拷贝转基因植株的比例 （ 2 ） 含核基质附着区 （ MAR ） 的转化载体 。 核基质结合区 （ Matrix attachment regions) 也称核骨架结合区 (Scaffold attachment regions) ， 是存在于真核细胞染色体中的一段与基质特异结合的 DNA 序列 （ 3 ） 利用位点特异性重组系统利用 PI 噬菌体的 cre/lox 、 酿酒酵母 FLP/FRT 和接合酵母 R/rs 位点特异性重组系统将转基因以单拷贝 、 位点特异地整合到事先整合有 / ox 、 丆 、 位点的植物上 。 （ 4 ） 利用去甲基化试剂 5 · 氮胞苷"},{"id":"2023-简答-5","year":"2023","type":"简答","no":5,"stem":"结合 Ti 介导的基因转化原理 。 （ 1 ） 为什么植物遗传转化过程共培养阶段需要超过 16 个小时 ？ （ 2 ） 为什么要向培养基中加入乙酰丁香酮 (AS) ？","answer":"乙酰丁香酮 (AS) ？ a ， 农杆菌对受体的识别 。 农杆菌对植物受体识别的基础是细菌的趋化性 。 受伤植物组织产生的一些糖类 、 氨基酸类 、 酚类物质具有趋化作用 。 引起农杆菌趋化作用的酚类物质是植物抗毒素和木质素生物合成的基本成分 ， 因此 ， 人们推测农杆菌在侵染过程中能破坏植物的防御机制 。 b 浓杆菌附着到植物受体细胞 。 根癌农杆菌附着于植物细胞是 T · DNA 加工和转移的前提 。 植物细胞表面的农杆菌附着位点是有限的 ， 根癌农杆菌和发根农杆菌的附着位点不同 。 每个植物细胞可以同时附着多种不同的农杆菌菌株 ， 但仅仅只能被一个或少数几个菌株所转化 。 实验证明 ， 只有在创伤部位生存了 16 小时之后的菌株才能诱发肿瘤 。 这段时间称为细胞调节期 。 在调节期内 ， 农杆菌会产生细微的纤丝而将自身缚附在植物细胞壁表面 。 c ， 诱导启动毒性区基因表达 。 当农杆菌在生长培养基上大量繁殖时 0 ． 所有的 Vir 区基因均处于非转录活性状态 。 当把植物受伤细胞提取液加入培养基时 ， 所有的 Vir 区基因均被诱导和活化 。 所以 ， 植物细胞分泌物 （ 糖 、 氨基酸和酚类物质等 ） 既是农杆菌定向附着到植物细胞表面的物质 ， 也能诱导和启动毒性区基因的表达 ， 为不 D NA 的转运做准备 。 d ， 类似接合孔复合体的合成和装配 。 T-D NA 的转运的第一步是通过细菌细胞膜 。 因此 ， 农杆菌必须形成一个跨膜通道 。 现在认为 ， Vi rB 蛋白充当了这个角色 ， 这些蛋白可能一起在膜上形成一种类似于细菌结合转移时所必需的结构 ， 即接合孔或性毛 (sex pilus) ， T-DNA 通过这种孔由农杆菌进入植物细胞 。 e. T-D NA 的加工和转运 。 Vir 基因操纵子被激活后 ， VirD 1 和 VirD2 蛋白在 T-DNA 的 25 bp 重复序列的右边界左起的第 3 和第 4 碱基间切下单链 T · DNA （ 从 3 ' 端开始合成置换 ） 。 T 链的 5 ' 端与 VirD2 蛋白共价结合 ， 以免受到 5- 外切酶的攻击 ： VirE2 蛋白与单链 T · DNA 非共价结合 ， 形成细长的核酸一蛋白复合体 (T 链复合体 ） ， 抵抗 3 ' 和 5 ' 外切核酸酶及内切核酸酶的降解 。 加工好的单链 T-D NA 复合体穿过由 VirB 蛋白形成的类接合孔进入植物受体细胞 ， 然后由 VirD2 和 VirE2 的核导向作用进入植物细胞核 。 f. T-D NA 的整合 。 遗传作图的分析表明 ， T-DNA 在植物染色体中的插入是随机的 (illegitimate recombination) ， 它可插入任何一条植物染色体 。 但插入位点常有以下特点 ： ． 优先整合到转录活跃的植物基因位点 @ T-DNA 与植物 DNA 连接处富含 A 、 T 碱基对 @ 植物 D NA 上的插入位点与 T-DNA 边界序列有一定程度的同源性 。 （ 1 ） 为什么植物遗传转化过程共培养阶段需要超过 16 个小时 ？ 共培养是指农杆菌与外植体共同培养的过程 ， 植物细胞表面的农杆菌附着位点是有限的 ， 根癌农杆菌和发根农杆菌的附着位点不同 。 每个植物细胞可以同时附着多种不同的农杆菌菌株 ， 但仅仅只能被一个或少数几个菌株所转化 。 实验证明 ， 只有在创伤部位生存了 16 小时之后的菌株才能诱发肿瘤 。 这段时间称为细胞调节期 。 在调节期内 ， 农杆菌会产生细微的纤丝而将自身缚附在植物细胞壁表面 。 （ 2 ） 为什么要向培养基中加入乙酰丁香酮 (AS) ？ Vir 区基因的活化是农杆菌 Ti 质粒转化的先决条件 ， 酚类化合物 、 单糖或糖酸 、 氨基酸 、 磷酸肌醇和低 PH 都影响 Vir 基因的活化 ， 其中常用的诱导物是乙酰丁香酮 (AS) 当农杆菌在生长培养基上大量繁殖时 ， 所有的 Vir 区基因均处于非转录活性状态 。 当把植物受伤细胞提取液加入培养基时 ， 所有的 Vir 区基因均被诱导和活化 。 所以 ， 植物细胞分泌物 （ 糖 、 氨基酸和酚类物质等 ） 既是农杆菌定向附着到植物细胞表面的物质 ， 也能诱导和启动毒性区基因的表达 ， 为 T-DNA 的转运做准备 。 Vir 区基因在接收到植物产生的创伤信号分子后 ， 首先是 v 法基因编码一种结合在膜上的化学信号受体蛋白 。 当受体蛋白与化学信号分子 （ 乙酰丁香酮 ） 结合后 ， 构象发生变化 ， c 端活化 ， 活化的 C 端有激酶的功能 ， 使蛋白上的组氨酸残基发生磷酸化 ， 从而激活 VirA 蛋白 。 激活的 VirA 蛋白可以转移其磷酸基团至 VirG 蛋白 ， 使 Vi 焱活化 。"},{"id":"2023-简答-6","year":"2023","type":"简答","no":6,"stem":"A. 葡萄糖 B 冰解酪蛋白 c ， 肌醇 D ， 乙酰丁香酮","answer":"（ 多选 ） 促进农杆菌侵染的物质 (ABD) B. 葡萄糖 B 冰解酪蛋白 c ， 肌醇 D. 乙酰丁香酮"},{"id":"2023-简答-8","year":"2023","type":"简答","no":8,"stem":"T | 质粒 4 个区 ， 哪个是制毒区 A. T-DNA B.Vir 区 C Con 区 D.ori 区","answer":"刊质粒 4 个区 ， 哪个是毒性区 (B) B. T-DNA B Vir 区 C.Con 区 D.ori 区"},{"id":"2023-简答-9","year":"2023","type":"简答","no":9,"stem":"（ 多选 ） 用于 DNA 定点诱变的方法 A. Kunkel B RT-PCR C.Nest PCR D.OverIap extension","answer":"（ 多选 ） 用于 DNA 定点诱变的方法 (AD) B. Kunkel B.RT-PCR C.Nest PCR D OverIap extension"},{"id":"2023-简答-12","year":"2023","type":"简答","no":12,"stem":"（ 多选 ） 作为入噬菌体选择标记 A, lacZ 基因 B ， 抗生素抗性基因 C.C 工失活 D ℃ 失活 E.spifij±","answer":"（ 多选 ） 作为入噬菌体选择标记 (ACE) B. lacz 基因 B ． 抗生素抗性基因 C.C I 失活 D ℃ II 失活 E.spi 筛选"},{"id":"2023-简答-13","year":"2023","type":"简答","no":13,"stem":"（ 多选 ） 下列哪种方法能用于 mRNA5 ' 端分析 A.SI 核酸酶作图 B.Primer extension C.5tRACE D.3jRACE","answer":"（ 多选 ） 下列哪种方法能用于 mRNA5 ' 端分析 (BC) A.SI 核酸酶作图 B.Primer extension C.5RACE D.3'RACE"},{"id":"2023-简答-15","year":"2023","type":"简答","no":15,"stem":"（ 多选 ） 检查基因表达差异 A.RNA-seq B.qRT-PCR C.DNA microarray D AFLP","answer":"（ 多选 ） 检查基因表达差异 ()B C) B.RNA-seq B.qRT-PCR C.DNA microarray D.AFLP"},{"id":"2023-论述-5","year":"2023","type":"论述","no":5,"stem":"无缝克隆 （ 是什么什么 ） ， 下列那种技术可用于无缝克隆 A. TAIL PCR B.EMSA C.Gibson cloning D ， 酵母单杂交技术 （ 多选 ） 促进农杆菌侵染的物质","answer":"无缝克隆 （ 是什么 ） ， 下列那种技术可用于无缝克隆 (C) B. TAIL PCR B.EMSA C.Gibson cloning D ， 酵母单杂交技术第 14 页共 106 页备考公众号 ： 求臻生物考研 体在免疫荧光层析试纸条上的加样区与荧光素标记第一捕获抗体结合 ， 通过毛细管作用到达检测区与第二捕获抗体结合形成三元复合物 ， 恒温反应 45 min 左右对该复合物进行荧光信号识别 ， 可对样本中 SARS · coV · 2 的核酸实现现场快速检测 。"},{"id":"2023-综合-3","year":"2023","type":"综合","no":3,"stem":"（ 回忆版 ， 题干不全面 ） 介绍了 “ 武昌鱼 \" 和它的鱼刺 （ 1 ） 鉴定调控鱼刺生长的关键基因 （ 2 ） 如何培育庄无鱼刺的武昌鱼","answer":"介绍了 “ 武昌鱼 ” 和它的鲑 JJ （ 1 ） 鉴定调控性长的基因 《 （ 2 ） 如何培育出无的武昌鱼 a ， 分离鱼身上的鱼刺 ， 剔除结缔组织 ， 放入液氮保存提取 RNA ， 筛选出相关基因 ； b ， 利用基因编辑技术 ， 在标准模式生物斑马鱼中依次敲除相关基因 ， 观察斑马鱼的性状改变情况 。 c ， 找到影响鱼刺生长的基因后 ， 在将基因重新转入无刺鱼体内验证是否鱼刺又重新长出 。 （ 2 ） 敲除控制鱼刺的基因 ， 获得第一代杂合无刺鱼 ， 用第 = 代杂合无刺鱼进行培育 ， 获得二代纯和无刺鱼 。"},{"id":"2023-综合-4","year":"2023","type":"综合","no":4,"stem":"炭疽病是一种由炭疽芽胞杆菌 （ “ Bacil/us a ） 引起的人畜共患传染病 ， 在生物武器和生物防恐中具有重要地位 。 炭疽毒素包括三种 3 种蛋白因子 ， 即保护性抗原 （ (A) 、 致死因子 （ LF ） 、 水肿因子 （ 一 E F 是 PA 护送另两种毒素进入人体或动物细胞 ， EF 是钙调蛋白依赖的腺苷酸环化酶 ， 可使细胞内 cAMP 浓度升高 ， 导致宿主防御能力下降 。 高效制各有生物活性的炭疽外毒素是深入系统研究炭疽致病机理 、 设计毒素抑制剂及开发新型诊断试剂的前提 。 利用异源重组表达技术很好地避免了从炭疽芽胞杆菌分离毒素蛋白带来的风险 。 炭疽水肿因子 （ EF ） 编码基因全长 2403 bp ， 编码蛋白由 800 个氨基酸构成 ， 其中 N 端 1 · 33 位氨基酸为信号肽序列 ， 在分泌到炭疽芽胞杆菌细胞外时被切除 。 现欲在大肠杆菌中表达去掉信号肽的炭疽水肿因子蛋白 ， 采用 pGEX · 6P 、 1 载体 ， 将目标基因装载到载体的 BamHl 和 Xhol 位点上 ， 构建 GST 融合表达系统 。 首先 ， 需要从炭疽芽胞杆菌的基因组中通过 PCR 扩增出该基因片段并装载到 BamHI 和 XhoI 酶切的载体上 ， 请设计出用于 PCR 扩增的引物序列 ， 并说明其设计原理 。 pGEX4TAI 乩血阴一 pro G № Ph c Pro 0 人 Leu Glu ^ 所 0 llis Årg O C()T GOÅTCC 百 C () ^ 帚 ] 丨 EcoRI Sma 1 门到 № 门终止码子 P(ac 傥 oR V 召猕 II ApaI BslE JI 嘞山 pSj 10dBam7Stop7 pGDX （ 约 4 900 bp) 刁 / 汐 N I pB 22","answer":"“ 炭疽病是一种由炭疽芽胞杆菌 0 B a cil/us a ） 引起的人畜共患传染病 ， 在生物武器和生物防恐中具有重要地位 。 炭疽毒素包括三种 3 种蛋白因子 ， 即保护性抗原 （ PA ） 、 致死因子 （ L F) 、 水肿因子 （ EF ） 。 PA 护送另两种毒素进入人体或动物细胞 ， EF 是钙调蛋白依赖的腺苷酸环化酶 ， 可使细胞内 cAMP 浓度升高 ， 导致宿主防御能力下降 。 高效制备有生物活性的炭疽外毒素是深入系统研究炭疽致病机理 、 设计毒素抑制剂及开发新型诊断试剂的前提 。 利用异源重组表达技术很好地避免了从炭疽芽胞杆菌分离毒素蛋白带来的风险 。 炭疽水肿因子 （ EF ） 编码基因全长 2403 bp ， 编码蛋白由 800 个氨基酸构成 ， 其中 N 端 1 · 33 位氨基酸为信号肽序列 ， 在分泌到炭疽芽胞杆菌细胞外时被切除 。 现欲在大肠杆菌中表达去掉信号肽的炭疽水肿因子蛋白 ， 采用 pGEX · 6 1 载体 ， 将目标基因装载到载体的 BamHl 和 XhoI 位点上 ， 构建 GST 融合表达系统 。 首先 ， 需要从炭疽芽胞杆菌的基因组中通过 PCR 扩增出该基因片段并装载到 BamHI 和 XhoI 酶切的载体上 ， 请设计出用于 PCR 扩增的引物序列 ， 并说明其设计原理 。 （ 1 ） 长度 ， 至少 16 核苷酸 ， 通常为 18 、 30 核苷酸 ， 更短 <script>
(function () {
  'use strict';
  var G = globalThis.GradeCore;
  var K_PROGRESS = 'zt-progress-v1';
  var K_SETTINGS = 'zt-settings-v1';
  var S = { progress: {}, settings: { year: 'all', type: 'all', mode: 'seq' }, queue: [], pos: 0, drafts: new Map() };

  function $(id) { return document.getElementById(id); }
  function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function restore(k, d) { try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : d; } catch (e) { return d; } }
  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('show'); }, 1600); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function typeMatch(it, want) { return want === 'all' || it.type === want || (want === '论述' && it.type === '综合'); }

  function buildQueue() {
    var list = DATA.items.filter(function (it) {
      if (S.settings.year !== 'all' && it.year !== S.settings.year) return false;
      return typeMatch(it, S.settings.type);
    });
    if (S.settings.mode === 'wrong') list = list.filter(function (it) { var p = S.progress[it.id]; return p && p.tries > 0 && p.best < 55; });
    else if (S.settings.mode === 'new') list = list.filter(function (it) { var p = S.progress[it.id]; return !p || !p.tries; });
    else if (S.settings.mode === 'random') list = shuffle(list);
    S.queue = list; S.pos = 0;
  }
  function current() { return S.queue[S.pos] || null; }

  function stats() {
    var done = 0, sum = 0, wrong = 0;
    Object.keys(S.progress).forEach(function (k) {
      var p = S.progress[k];
      if (p && p.tries > 0) { done++; sum += p.best; if (p.best < 55) wrong++; }
    });
    return { done: done, avg: done ? Math.round(sum / done) : 0, wrong: wrong, total: DATA.items.length };
  }

  function refreshChrome() {
    var st = stats();
    $('stats').textContent = '已练 ' + st.done + '/' + st.total + ' · 平均覆盖 ' + st.avg + '%';
    $('wrong-count').textContent = st.wrong;
    $('c-counter').textContent = S.queue.length ? (S.pos + 1) + ' / ' + S.queue.length : '0 / 0';
  }

  function resetResult() {
    $('result').hidden = true;
    $('r-kps').innerHTML = '';
    $('r-answer').textContent = '';
    $('r-score').innerHTML = '0<small>%</small>';
    $('r-tag').className = 'tag';
    $('r-tag').textContent = '—';
    $('r-sub').textContent = '';
    $('btn-reveal').disabled = false;
    $('btn-submit').disabled = false;
  }

  function render() {
    var it = current();
    resetResult();
    refreshChrome();
    if (!it) {
      $('c-year').textContent = '没有题目';
      $('c-type').textContent = '';
      $('c-no').textContent = '';
      $('stem').textContent = '这个筛选下没有题了';
      $('input').value = '';
      $('input').disabled = true;
      $('btn-submit').disabled = true;
      $('btn-reveal').disabled = true;
      return;
    }
    $('input').disabled = false;
    $('c-year').textContent = it.year + ' 年';
    $('c-type').textContent = it.type;
    $('c-no').textContent = '第 ' + it.no + ' 题';
    $('stem').textContent = it.stem;
    $('input').value = S.drafts.get(it.id) || '';
    $('input').focus();
  }

  function renderResult(res, it) {
    $('r-score').innerHTML = res.score + '<small>% 覆盖</small>';
    var tag = $('r-tag');
    tag.className = 'tag ' + res.level.tone;
    tag.textContent = res.level.label;
    $('r-sub').textContent = '要点命中 ' + res.hitCount + '/' + res.totalCount + ' · 作答 ' + res.chars + ' 字';
    var icon = { hit: '✅', part: '⚠️', miss: '❌' };
    $('r-kps').innerHTML = res.items.map(function (p) {
      var body = p.mark.map(function (s) { return s.miss ? '<mark>' + esc(s.t) + '</mark>' : esc(s.t); }).join('');
      return '<li><span class="ico">' + icon[p.status] + '</span><span>' + body + '<span class="cov">' + p.coverage + '%</span></span></li>';
    }).join('');
    $('r-answer').textContent = it.answer;
    $('result').hidden = false;
  }

  function submit() {
    var it = current();
    if (!it) return;
    var res = G.grade(it.answer, $('input').value);
    renderResult(res, it);
    var p = S.progress[it.id] || { best: 0, tries: 0 };
    p.tries += 1;
    p.best = Math.max(p.best, res.score);
    S.progress[it.id] = p;
    store(K_PROGRESS, S.progress);
    refreshChrome();
    $('result').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function reveal() {
    var it = current();
    if (!it) return;
    $('result').hidden = false;
    $('r-kps').innerHTML = '';
    $('r-score').innerHTML = '—';
    $('r-tag').className = 'tag warn';
    $('r-tag').textContent = '已看答案';
    $('r-sub').textContent = '这一次不计覆盖';
    $('r-answer').textContent = it.answer;
    $('btn-reveal').disabled = true;
  }

  function go(delta) {
    var it = current();
    if (it) S.drafts.set(it.id, $('input').value);
    if (!S.queue.length) return;
    S.pos = (S.pos + delta + S.queue.length) % S.queue.length;
    render();
  }

  function rebuild(notice) {
    buildQueue(); render();
    if (notice) toast(notice);
    if (!S.queue.length && S.settings.mode === 'wrong') toast('错题本是空的，先去练几道');
  }

  function bind() {
    $('btn-submit').addEventListener('click', submit);
    $('btn-reveal').addEventListener('click', reveal);
    $('btn-skip').addEventListener('click', function () { go(1); });
    $('btn-prev').addEventListener('click', function () { go(-1); });
    $('btn-next').addEventListener('click', function () { go(1); });
    $('input').addEventListener('input', function () { var it = current(); if (it) S.drafts.set(it.id, $('input').value); });
    $('input').addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); submit(); }
    });
    $('f-year').addEventListener('change', function (e) { S.settings.year = e.target.value; store(K_SETTINGS, S.settings); rebuild(); });
    $('f-type').addEventListener('change', function (e) { S.settings.type = e.target.value; store(K_SETTINGS, S.settings); rebuild(); });
    $('f-mode').addEventListener('change', function (e) { S.settings.mode = e.target.value; store(K_SETTINGS, S.settings); rebuild(); });
    $('btn-wrongbook').addEventListener('click', function () { $('f-mode').value = 'wrong'; S.settings.mode = 'wrong'; store(K_SETTINGS, S.settings); rebuild(); });
    $('btn-reset').addEventListener('click', function () {
      if (!confirm('清空本机所有练习进度？题目本身不受影响。')) return;
      S.progress = {}; store(K_PROGRESS, S.progress); rebuild('进度已清空');
    });
    document.addEventListener('keydown', function (e) {
      if (e.target && e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowRight') go(1);
      if (e.key === 'ArrowLeft') go(-1);
    });
  }

  function init() {
    document.title = '真题速刷';
    $('foot-meta').textContent = DATA.items.length + ' 题 · ' + DATA.meta.years.join(' / ') + ' 年';
    S.progress = restore(K_PROGRESS, {});
    S.settings = Object.assign(S.settings, restore(K_SETTINGS, {}));

    var sel = $('f-year');
    sel.innerHTML = '<option value="all">全部年份</option>' + DATA.meta.years.map(function (y) {
      return '<option value="' + esc(y) + '">' + esc(y) + ' 年</option>';
    }).join('');
    sel.value = S.settings.year;
    $('f-type').value = S.settings.type;
    $('f-mode').value = S.settings.mode;

    bind(); buildQueue(); render();

    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', function () { navigator.serviceWorker.register('../sw.js').catch(function () {}); });
    }
  }

  init();
})();
</script>
</body>
</html>
