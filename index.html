<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="练习区">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>基因工程 · 练习区</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#1b1f24; --muted:#6b7280; --line:#e5e7eb;
    --brand:#2f6feb; --brand-soft:#eaf1ff;
    --good:#12805c; --good-bg:#e6f6ef;
    --warn:#9a6700;--warn-bg:#fff4d6;
    --radius:16px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14161a; --card:#1c1f25; --ink:#e8eaed; --muted:#9aa3ad; --line:#2c3138;
      --brand:#7aa2ff; --brand-soft:#1e2a44;
      --good:#4ade80; --good-bg:#132a20;
      --warn:#fbbf24;--warn-bg:#33280f;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:720px;margin:0 auto;padding:26px 16px calc(40px + env(safe-area-inset-bottom))}
  h1{font-size:23px;margin:0 0 4px;letter-spacing:.01em}
  .sub{color:var(--muted);font-size:13.5px;margin-bottom:22px}
  .sub b{color:var(--ink);font-weight:600}

  .list{display:flex;flex-direction:column;gap:12px}
  a.card,div.card{
    display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 16px;text-decoration:none;color:inherit;
    box-shadow:0 1px 2px rgba(16,24,40,.04);
    transition:transform .05s ease, border-color .15s;
  }
  a.card:active{transform:translateY(1px)}
  a.card:hover{border-color:color-mix(in srgb,var(--brand) 45%,transparent)}
  .num{
    flex:0 0 52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:13px;line-height:1.15;text-align:center;
  }
  .body{flex:1;min-width:0}
  .name{font-size:17px;font-weight:650;margin-bottom:2px}
  .meta{font-size:12.5px;color:var(--muted)}
  .meta .dot{margin:0 6px;opacity:.5}
  .bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--brand);border-radius:2px}
  .go{flex:0 0 auto;color:var(--muted);font-size:20px}

  div.card.off{opacity:.55}
  div.card.off .num{background:var(--line);color:var(--muted)}
  div.card.off .go{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px}

  footer{margin-top:26px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
  .badge{display:inline-block;font-size:11.5px;color:var(--good);background:var(--good-bg);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>基因工程 · 练习区</h1>
  <div class="sub">华农 873 · 满分 150 · 拆开练，判分都在本机 <span class="badge">不花 token</span></div>

  <div class="list" id="list"></div>

  <footer>
    <span>进度存在这台设备上，换设备不通用</span>
  </footer>
</div>

<script>
(function () {
  'use strict';

  var TOOLS = [
    { key: 'mc', href: 'mc/', name: '名词解释', mark: 20, total: 227, store: 'mcyj-progress-v1', unit: '条', note: '5 × 4 分' },
    { key: 'jd', href: 'jd/', name: '简答', mark: 40, total: 52, store: 'jd-progress-v1', unit: '道', note: '5 × 8 分 · 采分点给分' },
    { key: 'xz', href: '', name: '选择题', mark: 30, total: 0, unit: '道', note: '15 × 2 分 · 还没做' },
    { key: 'ls', href: '', name: '综合分析', mark: 60, total: 0, unit: '道', note: '4 × 15 分 · 还没做' }
  ];

  function done(store) {
    try {
      var raw = localStorage.getItem(store);
      if (!raw) return 0;
      var p = JSON.parse(raw);
      return Object.keys(p).filter(function (k) { return p[k] && p[k].tries > 0; }).length;
    } catch (e) { return 0; }
  }

  var list = document.getElementById('list');
  list.innerHTML = TOOLS.map(function (t) {
    var ready = !!t.href;
    if (!ready) {
      return '<div class="card off">' +
        '<div class="num">' + t.mark + '分</div>' +
        '<div class="body"><div class="name">' + t.name + '</div>' +
        '<div class="meta">' + t.note + '</div></div>' +
        '<span class="go">未开放</span></div>';
    }
    var d = done(t.store);
    var pct = t.total ? Math.round(d / t.total * 100) : 0;
    return '<a class="card" href="' + t.href + '">' +
      '<div class="num">' + t.mark + '分</div>' +
      '<div class="body">' +
        '<div class="name">' + t.name + '</div>' +
        '<div class="meta">' + t.total + ' ' + t.unit + '<span class="dot">·</span>' + t.note +
          '<span class="dot">·</span>已练 ' + d + '</div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '</div>' +
      '<span class="go">›</span></a>';
  }).join('');

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
