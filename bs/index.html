<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="背诵">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon-192.png">
<title>背诵手册练习器</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#1b1f24; --muted:#6b7280; --line:#e5e7eb;
    --brand:#2f6feb; --brand-soft:#eaf1ff;
    --good:#12805c; --good-bg:#e6f6ef;
    --ok:#2f6feb;  --ok-bg:#eaf1ff;
    --warn:#9a6700;--warn-bg:#fff4d6;
    --bad:#b42318; --bad-bg:#fdecea;
    --radius:14px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14161a; --card:#1c1f25; --ink:#e8eaed; --muted:#9aa3ad; --line:#2c3138;
      --brand:#7aa2ff; --brand-soft:#1e2a44;
      --good:#4ade80; --good-bg:#132a20;
      --ok:#7aa2ff;  --ok-bg:#1e2a44;
      --warn:#fbbf24;--warn-bg:#33280f;
      --bad:#f87171; --bad-bg:#3a1715;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:820px;margin:0 auto;padding:18px 16px 64px}

  header.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  header.top h1{font-size:18px;margin:0}
  .badge{font-size:12px;color:var(--good);background:var(--good-bg);border-radius:999px;padding:2px 9px}
  .stats{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  select,button{font:inherit}
  select{appearance:none;background:var(--card);color:var(--ink);border:1px solid var(--line);
    border-radius:10px;padding:8px 30px 8px 11px;font-size:14px;max-width:100%;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:1px 9px}
  .chip.mark{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
  .counter{margin-left:auto;font-variant-numeric:tabular-nums}

  .stem{font-size:19px;line-height:1.6;font-weight:600;margin:4px 0 16px;word-break:break-word}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
    padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);
    color:var(--ink);font-size:16px;line-height:1.55;cursor:pointer;transition:border-color .12s,background .12s}
  .opt .k{flex:0 0 20px;font-weight:700;color:var(--muted)}
  .opt:disabled{cursor:default}
  .opt.right{border-color:var(--good);background:var(--good-bg)}
  .opt.right .k{color:var(--good)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.wrong .k{color:var(--bad)}
  .opt.dim{opacity:.55}

  .actions{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0 4px}
  button.btn{border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:10px 16px;cursor:pointer;font-size:15px}
  button.btn:active{transform:translateY(1px)}
  button.btn.ghost{background:transparent}
  .kbd{font-size:12px;opacity:.6;margin-left:6px}

  .result{border-top:1px dashed var(--line);padding:16px 0 2px;margin-top:14px}
  .verdict{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;margin-bottom:10px}
  .verdict.ok{color:var(--good)}
  .verdict.no{color:var(--bad)}
  .verdict .pick{font-size:13px;font-weight:500;color:var(--muted)}
  .answer{margin-top:12px;background:var(--brand-soft);border-radius:12px;padding:13px 15px;font-size:15px}
  .answer h3{margin:0 0 6px;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
  .answer p{margin:0 0 8px}
  .answer p:last-child{margin:0}
  .trap{color:var(--warn)}
  .note{font-size:12.5px;color:var(--muted);margin:12px 0 0;line-height:1.6}
  .nav{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
  .nav .spacer{flex:1}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);
    background:#111;color:#fff;padding:9px 15px;border-radius:10px;font-size:14px;
    opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90vw}
  .toast.show{opacity:.95;transform:translateX(-50%) translateY(0)}
  footer.foot{margin-top:22px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
  footer.foot button{background:none;border:0;color:var(--muted);text-decoration:underline dotted;cursor:pointer;padding:0;font-size:12px}

  @media (max-width:560px){
    .wrap{padding:14px 14px calc(26px + env(safe-area-inset-bottom))}
    .stats{width:100%;margin-left:0;font-size:12.5px}
    .filters select{flex:1 1 calc(50% - 7px);min-width:0;min-height:46px;font-size:16px}
    .filters select:first-child{flex:1 1 100%}
    .kbd{display:none}
    .card{padding:16px 15px}
    .stem{font-size:17.5px}
    .opt{font-size:15.5px;padding:13px}
    button.btn{min-height:48px;font-size:16px;flex:1 1 auto}
    .nav .btn{flex:1 1 46%}
    .nav .spacer{display:none}
    .toast{bottom:calc(18px + env(safe-area-inset-bottom))}
  }
  button,select,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  button{-webkit-touch-callout:none;user-select:none}
  select{font-size:16px}
  /* 返回入口页 */
  .back{align-self:center;display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;
    border-radius:11px;border:1px solid var(--line);color:var(--muted);text-decoration:none;
    font-size:19px;line-height:1;flex:0 0 auto;transition:border-color .15s,color .15s}
  .back:hover{border-color:var(--brand);color:var(--brand)}
  .back:active{transform:translateY(1px)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="back" href="../" aria-label="返回入口页" title="返回入口页">←</a>
    <h1 id="title">背诵手册练习器</h1>
    <span class="badge" id="badge">—</span>
    <span class="stats" id="stats"></span>
  </header>

  <div class="filters">
    <select id="f-set" aria-label="套别"></select>
    <select id="f-mode" aria-label="出题顺序">
      <option value="seq">按顺序</option>
      <option value="random">随机</option>
      <option value="new">只刷没做过的</option>
      <option value="wrong">只刷错题</option>
    </select>
  </div>

  <main class="card">
    <div class="meta">
      <span class="chip" id="c-set"></span>
      <span class="chip" id="c-no"></span>
      <span class="chip mark">2 分</span>
      <span class="counter" id="c-counter"></span>
    </div>
    <div class="stem" id="stem">—</div>
    <div class="opts" id="opts"></div>

    <div class="actions">
      <button class="btn ghost" id="btn-reveal">直接看答案</button>
      <button class="btn ghost" id="btn-skip">跳过</button>
    </div>

    <section class="result" id="result" hidden>
      <div class="verdict" id="r-verdict"></div>
      <div class="answer" id="r-answer"></div>
      <p class="note">答案与解析都取自《背诵手册》原文——按 <b>A/B/C/D</b> 或 <b>1/2/3/4</b> 也能选。</p>
    </section>

    <div class="nav">
      <button class="btn ghost" id="btn-prev">← 上一题</button>
      <span class="spacer"></span>
      <button class="btn" id="btn-next">下一题 →</button>
    </div>
  </main>

  <footer class="foot">
    <button id="btn-wrongbook">错题本（<span id="wrong-count">0</span>）</button>
    <button id="btn-export">导出进度</button>
    <button id="btn-reset">清空进度</button>
    <span id="foot-meta"></span>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>const DATA = {"meta":{"title":"背诵手册 · 知识点选择题","source":"1-5章背诵手册_选择题.md + 6-12章背诵手册_选择题.md + 13-18章背诵手册_选择题.md","total":445,"sets":["第一章 基因工程概述","第二章 分子克隆工具酶","第三章 分子克隆载体","第四章 表达载体","第五章 基因操作中的大分子分离和检测","第六章 基因操作中的核酸分析技术","第七章 PCR技术及其应用","第八章 DNA序列分析","第九章 DNA诱变","第十章 DNA文库的构建和目的基因的筛选","第十一章 基因组研究技术","第十二章 植物基因工程","第十三章 动物基因工程","第十四章 基因工程酶制剂","第十五章 细菌基因工程"],"builtAt":"2026-11-08"},"items":[{"n":1,"set":"第一章 基因工程概述","no":1,"stem":"基因工程区别于一般基因操作的关键是？","options":[{"key":"A","text":"通过基因操作定向改变或修饰生物体，并有明确应用目的"},{"key":"B","text":"只对基因做检测和分析，不改变生物体"},{"key":"C","text":"自然发生的基因变异，无应用目的"},{"key":"D","text":"只改造细胞，不涉及遗传物质"}],"answer":"A","explain":"\"定向改变＋明确应用目的\"两个要件缺一不可","trap":""},{"n":2,"set":"第一章 基因工程概述","no":2,"stem":"下列关于基因治疗的说法，正确的是？","options":[{"key":"A","text":"把健康基因移植到相关组织或细胞以缓解症状，包括基因修正、替换、增补，不改变遗传性状、不传给下一代"},{"key":"B","text":"改造生殖细胞，使后代获得健康基因"},{"key":"C","text":"只对致病基因做敲除，不导入外源基因"},{"key":"D","text":"会改变患者遗传性状，并遗传给下一代"}],"answer":"A","explain":"三策略；体细胞操作，不可遗传","trap":""},{"n":3,"set":"第一章 基因工程概述","no":3,"stem":"合成生物学的手段与目标是？","options":[{"key":"A","text":"通过基因工程创造新生物体，或合成新功能、新结构的化合物"},{"key":"B","text":"只对已有基因组进行测序和注释"},{"key":"C","text":"只对基因做敲除和失活"},{"key":"D","text":"只对蛋白质做分离纯化"}],"answer":"A","explain":"从找基因、组装成簇到重构代谢途径、优化细胞工厂","trap":""},{"n":4,"set":"第一章 基因工程概述","no":4,"stem":"基因工程中的\"生物反应器\"指？","options":[{"key":"A","text":"通过基因工程把细胞或生物体改造成高效生产生物活性物质的\"工厂\""},{"key":"B","text":"发酵车间里的不锈钢发酵罐设备"},{"key":"C","text":"专指转基因动物"},{"key":"D","text":"专指微生物"}],"answer":"A","explain":"可以是微生物、动物细胞、转基因动物或转基因植物","trap":""},{"n":5,"set":"第一章 基因工程概述","no":5,"stem":"关于基因的表述，正确的是？","options":[{"key":"A","text":"遗传物质的基本单位，是核酸分子上的一段片段，可连续或不连续"},{"key":"B","text":"只能是DNA，且必须连续排列"},{"key":"C","text":"只存在于染色体上"},{"key":"D","text":"只能编码蛋白质"}],"answer":"A","explain":"可DNA或RNA，可在染色体上或染色体外，如质粒、线粒体、叶绿体","trap":""},{"n":6,"set":"第一章 基因工程概述","no":6,"stem":"间断基因的特征是？","options":[{"key":"A","text":"序列中间插入与氨基酸编码无关的DNA间隔区，使一个基因分隔成不连续区段"},{"key":"B","text":"基因中间缺失一段而失活"},{"key"     var list = DATA.items.filter(function (it) { return S.settings.set === 'all' || it.set === S.settings.set; });
    if (S.settings.mode === 'wrong') list = list.filter(function (it) { var p = S.progress[it.n]; return p && p.last === 'wrong'; });
    else if (S.settings.mode === 'new') list = list.filter(function (it) { var p = S.progress[it.n]; return !p || !p.tries; });
    else if (S.settings.mode === 'random') list = shuffle(list);
    S.queue = list; S.pos = 0;
  }
  function current() { return S.queue[S.pos] || null; }

  function stats() {
    var done = 0, tries = 0, right = 0, wrong = 0;
    Object.keys(S.progress).forEach(function (k) {
      var p = S.progress[k];
      if (!p || !p.tries) return;
      done++; tries += p.tries; right += p.right || 0;
      if (p.last === 'wrong') wrong++;
    });
    return { done: done, tries: tries, right: right, wrong: wrong, total: DATA.items.length, rate: tries ? Math.round(right / tries * 100) : 0 };
  }

  function refreshChrome() {
    var st = stats();
    $('stats').textContent = '已练 ' + st.done + '/' + st.total + ' · 正确率 ' + st.rate + '%';
    $('wrong-count').textContent = st.wrong;
    $('c-counter').textContent = S.queue.length ? (S.pos + 1) + ' / ' + S.queue.length : '0 / 0';
  }

  function paint(it, picked) {
    var opts = $('opts');
    opts.innerHTML = '';
    it.options.forEach(function (o) {
      var b = document.createElement('button');
      b.className = 'opt';
      b.type = 'button';
      b.innerHTML = '<span class="k">' + o.key + '</span><span class="t">' + esc(o.text) + '</span>';
      b.dataset.key = o.key;
      if (picked) {
        if (o.key === it.answer) b.classList.add('right');
        else if (o.key === picked) b.classList.add('wrong');
        else b.classList.add('dim');
        b.disabled = true;
      } else {
        b.addEventListener('click', function () { answer(o.key); });
      }
      opts.appendChild(b);
    });
  }

  function render() {
    var it = current();
    S.answered = false; S.picked = '';
    $('result').hidden = true;
    $('r-verdict').innerHTML = '';
    $('r-answer').innerHTML = '';
    $('btn-reveal').disabled = false;
    refreshChrome();

    if (!it) {
      $('c-set').textContent = '没有题目';
      $('c-no').textContent = '';
      $('stem').textContent = '这个筛选下没有题了';
      $('opts').innerHTML = '';
      return;
    }
    $('c-set').textContent = it.set;
    $('c-no').textContent = '第 ' + it.no + ' 题';
    $('stem').textContent = it.stem;
    paint(it, '');
  }

  function showAnswer(it, picked) {
    S.answered = true; S.picked = picked;
    paint(it, picked);
    var right = picked === it.answer;
    var v = $('r-verdict');
    v.className = 'verdict ' + (picked ? (right ? 'ok' : 'no') : '');
    if (!picked) v.innerHTML = '答案：' + it.answer;
    else if (right) v.innerHTML = '✅ 对了 <span class="pick">你选 ' + picked + '</span>';
    else v.innerHTML = '❌ 错了 <span class="pick">你选 ' + picked + '，正确是 ' + it.answer + '</span>';

    var html = '<h3>正确答案：' + it.answer + '</h3>';
    if (it.explain) html += '<p>' + esc(it.explain) + '</p>';
    if (it.trap) html += '<p class="trap">⚠️ ' + esc(it.trap) + '</p>';
    if (!it.explain && !it.trap) html += '<p style="color:var(--muted)">这道题还没写解析。</p>';
    $('r-answer').innerHTML = html;
    $('result').hidden = false;
  }

  function answer(key) {
    var it = current();
    if (!it || S.answered) return;
    showAnswer(it, key);
    var p = S.progress[it.n] || { tries: 0, right: 0, last: '' };
    p.tries += 1;
    if (key === it.answer) { p.right = (p.right || 0) + 1; p.last = 'right'; }
    else p.last = 'wrong';
    S.progress[it.n] = p;
    store(K_PROGRESS, S.progress);
    refreshChrome();
    setTimeout(function () { $('result').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }, 30);
  }

  function reveal() {
    var it = current();
    if (!it) return;
    showAnswer(it, '');
    $('btn-reveal').disabled = true;
  }

  function go(delta) {
    if (!S.queue.length) return;
    S.pos = (S.pos + delta + S.queue.length) % S.queue.length;
    render();
  }

  function rebuild(notice) {
    buildQueue(); render();
    if (notice) toast(notice);
    if (!S.queue.length && S.settings.mode === 'wrong') toast('错题本是空的，先去练几道');
  }

  function bind() {
    $('btn-next').addEventListener('click', function () { go(1); });
    $('btn-prev').addEventListener('click', function () { go(-1); });
    $('btn-skip').addEventListener('click', function () { go(1); });
    $('btn-reveal').addEventListener('click', reveal);
    $('f-set').addEventListener('change', function (e) { S.settings.set = e.target.value; store(K_SETTINGS, S.settings); rebuild(); });
    $('f-mode').addEventListener('change', function (e) { S.settings.mode = e.target.value; store(K_SETTINGS, S.settings); rebuild(); });
    $('btn-wrongbook').addEventListener('click', function () {
      $('f-mode').value = 'wrong'; S.settings.mode = 'wrong'; store(K_SETTINGS, S.settings); rebuild();
    });
    $('btn-export').addEventListener('click', function () {
      var payload = { exportedAt: new Date().toISOString(), stats: stats(), progress: S.progress };
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '背诵手册进度-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      toast('已导出');
    });
    $('btn-reset').addEventListener('click', function () {
      if (!confirm('清空本机所有练习进度（得分和错题本）？题目本身不受影响。')) return;
      S.progress = {}; store(K_PROGRESS, S.progress); rebuild('进度已清空');
    });
    document.addEventListener('keydown', function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var k = e.key.toUpperCase();
      var idx = 'ABCD'.indexOf(k);
      if (idx < 0) idx = ['1', '2', '3', '4'].indexOf(e.key);
      var it = current();
      if (idx >= 0 && it && !S.answered && it.options[idx]) { e.preventDefault(); answer(it.options[idx].key); return; }
      if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); go(1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
    });
  }

  function init() {
    document.title = DATA.meta.title + '练习器';
    document.getElementById('badge').textContent = DATA.meta.sets.length + ' 章 · ' + DATA.items.length + ' 题';
    $('title').textContent = DATA.meta.title + '练习器';
    $('foot-meta').textContent = DATA.meta.total + ' 道 · 来源 ' + DATA.meta.source;
    S.progress = restore(K_PROGRESS, {});
    S.settings = Object.assign(S.settings, restore(K_SETTINGS, {}));

    var sel = $('f-set');
    sel.innerHTML = '<option value="all">全部章节</option>' + DATA.meta.sets.map(function (s) {
      return '<option value="' + esc(s) + '">' + esc(s) + '</option>';
    }).join('');
    sel.value = S.settings.set;
    $('f-mode').value = S.settings.mode;

    bind(); buildQueue(); render();

    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', function () { navigator.serviceWorker.register('../sw.js').catch(function () {}); });
    }
  }

  init();
})();
</script>
</body>
</html>
